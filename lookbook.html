/* the "...EX" / "...AEX" coded items are a separate, older product line
   photographed with noticeably more padding around the garment than the
   site's own 263-prefixed items — confirmed by measuring actual pixel
   fill against a shared background threshold across a broad sample
   (EX items ~60-65% fill, 263TS items ~75-84%, consistently, not
   per-photo variance). Same underlying issue as the daily-wear model
   photo framing, just for flat product shots this time: object-fit
   can't fix a difference baked into the source file's own padding, so
   this flags which product-photo containers should get the zoom class
   defined right below it. */
function isLooseCropCode(code){
  return /EX$/.test(code || '');
}

/* a few special/commemorative items have no confirmed price in any source yet (price:0) */
function fmtPrice(price){
  return price ? `${price.toLocaleString()}원` : 'PRICE TBD';
}

/* ---------------- images/looks/ auto-matching ----------------
   Naming convention: {TOP code}_{BOTTOM code}[_{other codes}]_{mo|ed}.jpg
   (lowercase, full M/F/U-suffixed codes, slots ordered TOP→BOTTOM→other; a
   TOP-only look just omits the rest, e.g. "263ts002f_mo.jpg"). The older
   _model/_editorial suffixes still work too (see SUFFIX_ALIASES below), so
   existing files never needed renaming. Drop a file matching a look's codes
   into images/looks/ and it's picked up automatically — no code change
   needed. Until then the <img> quietly falls back to the look's temporary
   placeholder photo. */
const LOOK_IMG_SLOT_ORDER = ['TOP','BOTTOM','OUTER','BAG'];
function lookFilenameBase(items, upper){
  const ordered = [...items].sort((a,b)=>LOOK_IMG_SLOT_ORDER.indexOf(a.slot)-LOOK_IMG_SLOT_ORDER.indexOf(b.slot));
  return ordered.map(it=>{
    const code = PRODUCTS[it.code]?.code || it.code;
    return upper ? code.toUpperCase() : code.toLowerCase();
  }).join('_');
}
function lookImgTag(items, type, fallbackSrc, attrs=''){
  /* file case is a common real-world mismatch (static hosts are case-sensitive),
     so this tries the codes as-uploaded for ghost cuts (UPPER, matching
     images/products/) before falling back to an all-lowercase guess.
     Both the short (_mo/_ed) and original (_model/_editorial) suffixes are
     tried, so a dropped-in file works either way it happens to be named. */
  const SUFFIX_ALIASES = {model:['mo','model'], editorial:['ed','editorial']};
  const chainFor = t => (SUFFIX_ALIASES[t] || [t]).flatMap(suffix => {
    const upperBase = `images/looks/${lookFilenameBase(items, true)}_${suffix}`;
    const lowerBase = `images/looks/${lookFilenameBase(items, false)}_${suffix}`;
    return [`${upperBase}.jpg`, `${upperBase}.jpeg`, `${upperBase}.png`,
             `${lowerBase}.jpg`, `${lowerBase}.jpeg`, `${lowerBase}.png`];
  });
  /* the look's own img/fitImg field is always the curated, correct photo —
     trust it first. The auto-guessed filename chain is only a last-resort
     backup for the rare case that field is missing or wrong, because it can
     otherwise accidentally match a real but WRONG file: two colorways of the
     same top+bottom design (e.g. 10716YX vs 10716YX-2, same underlying
     PRODUCTS .code) produce an identical guessed filename, so whichever
     colorway's photo happens to be on disk under that guessed name would
     silently win for every look sharing that code pair. */
  const chain = type==='editorial' ? [fallbackSrc, ...chainFor('editorial'), ...chainFor('model')] : [fallbackSrc, ...chainFor(type)];
  return `<img src="${chain[0]}" data-chain='${JSON.stringify(chain.slice(1))}' onerror="imgChainNext(this)" ${attrs}>`;
}
function imgChainNext(img){
  let chain = [];
  try{ chain = JSON.parse(img.dataset.chain || '[]'); }catch(e){}
  if(!chain.length){
    img.onerror = null;
    const parent = img.parentElement;
    if(parent && !parent.querySelector('.img-missing')){
      if(getComputedStyle(parent).position === 'static') parent.style.position = 'relative';
      const ph = document.createElement('div');
      ph.className = 'img-missing';
      ph.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M4 16l5-4.2 3 2.4 3.5-3 4.5 5.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>PHOTO<br>COMING SOON</span>`;
      parent.appendChild(ph);
    }
    img.remove();
    return;
  }
  img.src = chain.shift();
  img.dataset.chain = JSON.stringify(chain);
}

/* resolves the M/W code pair for an item regardless of which side it.code points to */
function genderInfo(code){
  const p = PRODUCTS[code];
  if(!p || !p.pairCode) return null;
  const q = PRODUCTS[p.pairCode];
  if(!q) return null;
  return {
    m: p.gender==='Men' ? code : p.pairCode,
    w: p.gender==='Women' ? code : p.pairCode,
    active: p.gender==='Women' ? 'W' : 'M',
  };
}

/* switches a couple-look's MEN/WOMEN variant in place — used by the pair
   toggle buttons, the swipe gesture, and jumping to a search result on the
   opposite-gender side. Only the hero photo (crossfade) and the item panel
   (code/color/price) actually depend on the variant, so this updates just
   those two instead of re-rendering the whole page — the breadcrumb, nav
   arrows and related-looks strip never change, and don't need to flicker. */
/* Slides #ldHeroImg to a new photo: a second <img> enters from one side
   while the current one exits the other, then the new one is promoted
   to the #ldHeroImg id and the old one dropped. This deliberately
   mirrors the drag-swipe's own translateX motion instead of doing an
   opacity crossfade — an opacity dissolve only looks clean between two
   images that share structure (like the STYLE MIX mannequin layers,
   pixel-registered on the same pose). These are two completely
   different photos/poses, so fading one into the other shows both at
   once mid-transition as a double-exposure ghost (an arm or racket
   from the outgoing photo visible through the incoming one) — that
   double-exposure is what read as a glitchy "bounce", not an
   animation-timing issue. A slide never overlaps two photos at partial
   opacity, so there's nothing to ghost.
   dir: 1 slides the new photo in from the right (old exits left),
        -1 the reverse — pass whichever side conceptually matches the
        change (e.g. the WOMEN button sits right of MEN in the pill). */
let heroXfade = null; /* the in-flight transition, if any: { next } */
let heroXfadeToken = 0;
function crossfadeHeroTo(photo, dir, altText){
  const visual = document.getElementById('ldVisual');
  const img = document.getElementById('ldHeroImg');
  if(!visual || !img || !photo) return;
  if(!heroXfade && img.getAttribute('src') === photo) return;
  /* no separate reduced-motion branch here on purpose — that used to
     short-circuit straight to `img.src = photo`, which blanks the photo
     for however long the new one takes to actually load over the
     network (nothing was covering the gap). The global
     prefers-reduced-motion stylesheet rule already forces every
     transition-duration to .01ms site-wide, so falling through to the
     normal preload-then-swap flow below still ends up visually instant
     once the photo's ready — just without ever showing a blank photo
     while it loads. */
  /* a still-in-flight transition from a previous rapid tap has to be
     cancelled before starting a new one — two overlapping transitions
     can each finish and try to promote their own <img> to #ldHeroImg,
     leaving a stale photo on top with nothing to signal it's wrong
     (the toggle button and item codes update synchronously elsewhere
     in swapLookPair and were always correct; only this async photo
     swap could fall behind on a quick double-tap). Snap the base img
     back to a clean, centered baseline before restarting. */
  if(heroXfade){
    heroXfade.next.remove();
    heroXfade = null;
    img.style.transition = 'none';
    img.style.transform = 'translateX(0)';
    void img.offsetWidth;
    img.style.transition = '';
  }
  const token = ++heroXfadeToken;
  /* preload off-DOM first, exactly like mixSetLayer's mannequin layers —
     starting the slide on an <img> whose src was just set (still
     in-flight) races real-device decode() for a freshly-appended,
     absolutely-positioned element; on a slow/uncached load (typically
     the pair variant's photo, since the default view's photo is usually
     already cached from initial load) that race can resolve in the same
     paint as the final frame, collapsing the whole .2s slide into a
     single hard cut instead of animating it. */
  const preloader = new Image();
  preloader.src = photo;
  if(preloader.complete && preloader.naturalWidth > 0){
    /* already in the browser's cache — resolve on the spot rather than
       waiting a load-event tick, so a superseded call in a rapid-tap
       chain vacates the token before the next tap's own preload runs. */
    startSlide();
  } else {
    preloader.onload = ()=>{ if(token === heroXfadeToken) startSlide(); };
    preloader.onerror = ()=>{ if(token === heroXfadeToken) img.src = photo; };
  }
  function startSlide(){
    const enterFrom = dir > 0 ? '100%' : '-100%';
    const exitTo = dir > 0 ? '-100%' : '100%';
    const next = document.createElement('img');
    next.src = photo;
    next.alt = altText != null ? altText : img.alt;
    next.style.position = 'absolute';
    next.style.inset = '0';
    next.style.width = '100%';
    next.style.height = '100%';
    next.style.objectFit = 'cover';
    next.style.objectPosition = 'top center';
    next.style.zIndex = '3';
    next.style.transform = `translateX(${enterFrom})`;
    visual.appendChild(next);
    const state = { next };
    heroXfade = state;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(heroXfade !== state) return;
      /* kept shorter than the look-to-look hero slide on purpose — this
         is a high-frequency toggle a shopper taps back and forth
         repeatedly, not a one-off page transition, so it still needs to
         feel responsive under back-to-back taps rather than each one
         queuing up a leisurely animation — just no longer so short it
         reads as a snap instead of a slide. */
      next.style.transition = 'transform .3s var(--ease-out)';
      img.style.transition = 'transform .3s var(--ease-out)';
      next.style.transform = 'translateX(0)';
      img.style.transform = `translateX(${exitTo})`;
      let cleaned = false;
      const cleanup = ()=>{
        /* also guards the safety-net timer: if this call was
           cancelled by a newer one after this point (heroXfade no
           longer === state) but before either trigger fired, the
           timer must NOT be allowed to promote/remove anything late —
           that stale promotion racing a newer, already-settled one is
           what could leave the wrong photo on screen. */
        if(cleaned || heroXfade !== state) return;
        cleaned = true;
        heroXfade = null;
        img.remove();
        next.removeAttribute('style');
        next.id = 'ldHeroImg';
      };
      next.addEventListener('transitionend', cleanup, {once:true});
      setTimeout(cleanup, 400);
    }));
  }
}
function swapLookPair(id, view, skipPhotoAnim){
  const look = LOOKS.find(l=>l.id===id);
  if(!look || !look.pair || lookPairView===view) return;
  lookPairView = view;
  const showW = view === 'W';
  const variant = showW ? look.pair : look;

  /* skipPhotoAnim: the drag-swipe handler already slid the correct photo
     into place itself (finger-tracked, frame by frame) before calling
     here — redoing the crossfade on top of that snapped the old photo
     back for a frame and then re-faded it, which read as a flicker.
     Only run this fade for entry points that never animated the photo
     themselves (toggle buttons, edge-tap zone). */
  if(!skipPhotoAnim){
    crossfadeHeroTo(variant.fitImg || variant.img, showW ? 1 : -1);
  }

  const itemsEl = document.querySelector('.ld-items');
  if(itemsEl){
    const swapContent = ()=>{
      itemsEl.innerHTML = buildItemsHtml(look, variant);
      bindLookItemClicks(id);
      document.querySelectorAll('.ii-gtoggle').forEach(positionToggleThumb);
    };
    if(skipPhotoAnim || REDUCE_MOTION){
      /* the drag-swipe path already gave the photo its own finger-tracked
         motion, and reduced-motion means no fade anywhere — either way,
         adding a delay here would just be a lag with nothing to show for
         it, so keep this an instant swap. */
      swapContent();
    } else {
      /* cross-dissolve the TOP/BOTTOM code/price panel along with the
         photo instead of it hard-popping to the new text mid-crossfade —
         a smoothly animating photo next to instantly-replaced text read
         as two different interactions happening at once rather than one
         coherent transition. */
      itemsEl.classList.add('ld-items-fading');
      const token = ++itemsSwapToken;
      setTimeout(()=>{
        /* a rapid second tap before this fires must not let this now-
           stale swap land after the newer one already applied — that
           would briefly show the wrong gender's code/price text. */
        if(token !== itemsSwapToken) return;
        swapContent();
        requestAnimationFrame(()=>itemsEl.classList.remove('ld-items-fading'));
      }, 140);
    }
  }

  document.querySelectorAll('.ld-look-gtoggle button').forEach(b=>b.classList.toggle('active', b.dataset.lg===view));
  document.querySelectorAll('.ld-pair-dots .ld-dot').forEach((d,i)=>{
    const isActive = (i===0)===(view==='M');
    d.classList.toggle('active', isActive);
    d.setAttribute('aria-pressed', isActive ? 'true' : 'false');
  });
  positionToggleThumb(document.querySelector('.ld-look-gtoggle'));

  document.querySelectorAll('.ld-related-thumb[data-related-id]').forEach(thumb=>{
    const rl = LOOKS.find(l=>l.id===thumb.dataset.relatedId);
    if(!rl) return;
    const rv = (view==='W' && rl.pair) ? rl.pair : rl;
    const rimg = thumb.querySelector('img');
    if(rimg) rimg.src = rv.fitImg || rv.img;
  });
}

function buildItemsHtml(look, variant){
  return variant.items.map((it,i)=>{
    const p = PRODUCTS[it.code];
    const isBottom = it.slot.toLowerCase()==='bottom';
    const gi = (!look.pair && !look.noGenderToggle && !isBottom) ? genderInfo(it.code) : null;
    const toggleHtml = gi
      ? `<div class="ii-gtoggle"><button type="button" class="${gi.active==='M'?'active':''}" data-g="M">M</button><button type="button" class="${gi.active==='W'?'active':''}" data-g="W">W</button></div>`
      : '';
    const colorLine = p && p.color ? `<div class="ii-color">${p.color}</div>` : '';
    const figureHtml = isBottom ? '' : `<div class="ii-figure${isLooseCropCode(p?.code)?' loose-crop':''}"><img src="${itemFig(it.code)}" alt="${p?p.name:it.slot}"></div>`;
    /* only offer the jump when this item's code actually has a mannequin
       cutout uploaded — checked against MIX_TOPS/MIX_BOTTOMS (the pool
       filtered down to confirmed-existing files by initMixPool()), not
       the raw candidate pool, which lists codes that don't all have a
       file yet. Otherwise the button would land on Style Mix without
       actually showing the item, which reads as broken. */
    const inMixPool = (isBottom ? MIX_BOTTOMS : MIX_TOPS).includes(it.code);
    const mixBtnHtml = inMixPool
      ? `<button type="button" class="ii-mix-link" onclick="event.stopPropagation();openInStyleMix(this.closest('.ld-item'))" aria-label="STYLE MIX에서 보기">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.2" y="5.8" width="7.2" height="7.2" rx="1.1" stroke="currentColor" stroke-width="1.3"/><rect x="6.6" y="2.2" width="7.2" height="7.2" rx="1.1" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>STYLE MIX</span>
        </button>`
      : '';
    return `<div class="ld-item" data-slot="${it.slot.toLowerCase()}" data-active-code="${it.code}" data-code-m="${gi?gi.m:''}" data-code-w="${gi?gi.w:''}">
      <div class="ii-top"><span class="ii-slot">${it.slot}</span>${mixBtnHtml}</div>
      ${figureHtml}
      <div class="ii-name">${p?p.code:it.code}</div>
      ${colorLine}
      <div class="ii-code">${p?fmtPrice(p.price):''}</div>
      ${toggleHtml}
    </div>`;
  }).join('');
}
/* MIX_TOPS/MIX_BOTTOMS (see initMixPool()) usually aren't ready yet by
   the time a LOOK page first renders, so its item panel initially under-
   shows "STYLE MIX" buttons; this re-renders that panel once the pool
   resolves, so the buttons catch up without the user needing to leave
   and come back. No-ops on any other view or if the panel isn't mounted. */
function refreshLookMixButtons(){
  if(parseHash().view !== 'look') return;
  const itemsEl = document.querySelector('.ld-items');
  const look = LOOKS.find(l=>l.id===parseHash().param);
  if(!itemsEl || !look) return;
  const variant = (lookPairView==='W' && look.pair) ? look.pair : look;
  itemsEl.innerHTML = buildItemsHtml(look, variant);
  bindLookItemClicks(look.id);
  document.querySelectorAll('.ii-gtoggle').forEach(positionToggleThumb);
}
function renderLook(id){
  const look = LOOKS.find(l=>l.id===id);
  if(!look) return renderCover();
  const c = CATEGORIES[look.cat];
  const catLooks = LOOKS.filter(l=>l.cat===look.cat);
  const idx = catLooks.findIndex(l=>l.id===id);
  const prev = catLooks[(idx-1+catLooks.length)%catLooks.length];
  const next = catLooks[(idx+1)%catLooks.length];

  /* a "couple" look has a look.pair object — the same shape as the look
     itself (img/fitImg/items/hotspots) but photographed on the opposite-
     gender model for the same matching design. Toggling (MEN/WOMEN tap,
     or swiping the hero) swaps the photo AND the item panel to that
     variant in place — not a side-by-side layout. */
  const showW = lookPairView==='W' && look.pair;
  const variant = showW ? look.pair : look;

  /* a look can optionally list a few model-cut photos of the same outfit
     (different angles/poses) via look.photos — the hero then shows a small
     tap-through dot gallery instead of just the one shot. Falls back to the
     single fitImg/img when absent. Not used together with look.pair. */
  const photos = !look.pair && look.photos && look.photos.length ? look.photos : [variant.fitImg || variant.img];
  const activePhoto = photos[Math.min(lookGalleryIdx, photos.length - 1)];
  const dotsHtml = photos.length > 1 ? `<div class="ld-gallery-dots">${photos.map((_,i)=>
    `<button type="button" class="ld-dot${i===lookGalleryIdx?' active':''}" onclick="event.stopPropagation();selectLookPhoto(${i})" aria-label="Photo ${i+1}" aria-pressed="${i===lookGalleryIdx}"></button>`
  ).join('')}</div>` : '';

  const pairToggleHtml = look.pair ? `<div class="ld-look-gtoggle">
      <button type="button" class="${showW?'':'active'}" data-lg="M" aria-pressed="${!showW}">MEN</button>
      <button type="button" class="${showW?'active':''}" data-lg="W" aria-pressed="${showW}">WOMEN</button>
    </div>` : '';

  /* two-dot indicator under the hero photo for paired looks — signals that
     the photo itself is swipeable/tappable between MEN and WOMEN, since
     nothing about a plain photo otherwise hints that a swipe does anything.
     Mirrors the multi-photo gallery dots (mutually exclusive with those). */
  const pairDotsHtml = look.pair ? `<div class="ld-gallery-dots ld-pair-dots">
    <button type="button" class="ld-dot${showW?'':' active'}" onclick="event.stopPropagation();swapLookPair('${look.id}','M');" aria-label="Men" aria-pressed="${!showW}"></button>
    <button type="button" class="ld-dot${showW?' active':''}" onclick="event.stopPropagation();swapLookPair('${look.id}','W');" aria-label="Women" aria-pressed="${showW}"></button>
  </div>` : '';

  const heroHtml = `
    <img src="${activePhoto}" alt="${look.caption}" id="ldHeroImg">
    <div class="vscrim"></div>
    <div class="ld-caption"><div class="eyebrow">${c.label}</div></div>
    ${dotsHtml}${pairDotsHtml}`;

  const itemsHtml = buildItemsHtml(look, variant);

  /* All looks in this category, current one included — a swipeable strip
     so jumping to any other look is one tap, not a click-through-them-
     all-in-order chain, replacing PREV/NEXT LOOK. Shows the 모델컷 (not
     the editorial crop) for each, and follows the current MEN/WOMEN
     toggle state: looks with a .pair show whichever gender is currently
     active, kept in sync live by swapLookPair when the toggle is tapped.
     The current look stays in the strip (rather than being filtered out)
     so its thumbnail can be marked active — a "you are here" landmark in
     the strip; tapping it is a harmless no-op (go() already no-ops on
     navigating to the current hash). */
  const otherLooksHtml = catLooks.map(l=>{
    const v = (lookPairView==='W' && l.pair) ? l.pair : l;
    const isCurrent = l.id===id;
    return `<a class="ld-related-thumb${isCurrent?' active':''}" data-related-id="${l.id}" href="#look/${l.id}" onclick="navClick(event,'look','${l.id}')" ${isCurrent?'aria-current="page"':''}>${lookImgTag(v.items, 'model', v.fitImg, `alt="${l.caption}" loading="lazy"`)}</a>`;
  }).join('');

  /* arrows/swipe/edge-taps mean one of two totally different things
     depending on the look: for a paired look they toggle MEN/WOMEN (the
     related-looks carousel above now owns "jump to a different outfit"),
     for an unpaired look there's no variant to toggle so they fall back
     to prev/next look, same as before. lookPairView is read live inside
     the onclick (not baked at render time) so the arrows keep toggling
     correctly after the first tap. */
  const heroArrowsHtml = look.pair
    ? `<button type="button" class="ec-arrow ec-arrow-prev" onclick="event.stopPropagation();swapLookPair('${id}', lookPairView==='W'?'M':'W')" aria-label="Toggle men/women">&#8249;</button>
       <button type="button" class="ec-arrow ec-arrow-next" onclick="event.stopPropagation();swapLookPair('${id}', lookPairView==='W'?'M':'W')" aria-label="Toggle men/women">&#8250;</button>`
    : `<button type="button" class="ec-arrow ec-arrow-prev" onclick="event.stopPropagation();go('look','${prev.id}')" aria-label="Previous look">&#8249;</button>
       <button type="button" class="ec-arrow ec-arrow-next" onclick="event.stopPropagation();go('look','${next.id}')" aria-label="Next look">&#8250;</button>`;

  return `<div class="view">
    <section class="look-detail" data-prev="${prev.id}" data-next="${next.id}" data-id="${id}">
      <div class="ld-crumb">
        <a class="ld-back" href="#category/${look.cat}" onclick="event.preventDefault();go('category','${look.cat}')">&larr; ${c.label}</a>
        <span class="sep">/</span><h1>LOOK ${String(look.num).padStart(2,'0')}</h1>
        ${pairToggleHtml}
      </div>
      <div class="ld-split">
        <div class="ld-visual" id="ldVisual">
          ${heroHtml}
          ${heroArrowsHtml}
        </div>
        <nav class="ld-nav ld-nav-mid" aria-label="More looks in ${c.label}">
          <div class="ld-related-strip">${otherLooksHtml}</div>
        </nav>
        <div class="ld-items">${itemsHtml}</div>
      </div>
    </section>
    ${renderFullLineup(look.cat)}
  </div>`;
}

function wornWithFor(code, excludeLookId){
  return LOOKS.filter(l=>l.id!==excludeLookId && l.items.some(it=>it.code===code));
}

function selectLookPhoto(i){
  const look = LOOKS.find(l=>l.id===parseHash().param);
  if(!look) return;
  const photos = look.photos && look.photos.length ? look.photos : [look.fitImg||look.img];
  if(i===lookGalleryIdx || !photos[i]) return;
  const dir = i > lookGalleryIdx ? 1 : -1;
  lookGalleryIdx = i;
  crossfadeHeroTo(photos[i], dir);
  document.querySelectorAll('.ld-dot').forEach((d,idx)=>{
    d.classList.toggle('active', idx===i);
    d.setAttribute('aria-pressed', idx===i ? 'true' : 'false');
  });
}

/* item-panel click handlers only — these need re-binding every time
   .ld-items' innerHTML changes (both on a full page render and on
   swapLookPair's lighter in-place update), unlike the rest of
   bindLookInteractions which only ever runs once per page render. */
function bindLookItemClicks(id){
  document.querySelectorAll('.ld-item').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.ii-gtoggle')) return;
      openProduct(el.dataset.activeCode, id);
    });
    el.querySelectorAll('.ii-gtoggle button').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const code = btn.dataset.g==='M' ? el.dataset.codeM : el.dataset.codeW;
        const p = PRODUCTS[code];
        if(!p) return;
        el.dataset.activeCode = code;
        const figEl = el.querySelector('.ii-figure img');
        if(figEl) figEl.src = itemFig(code);
        el.querySelector('.ii-name').textContent = p.code;
        const colorEl = el.querySelector('.ii-color');
        if(colorEl) colorEl.textContent = p.color;
        el.querySelector('.ii-code').textContent = fmtPrice(p.price);
        el.querySelectorAll('.ii-gtoggle button').forEach(b=>b.classList.toggle('active', b===btn));
        positionToggleThumb(el.querySelector('.ii-gtoggle'));
      });
    });
  });
}
/* Share the current look's URL: native share sheet where available
   (mobile), clipboard copy + toast everywhere else. */
/* Shares whatever page is currently open (cover, category, a look, mix,
   search) - lives in the top nav next to STYLE MIX/search so it's reachable
   from anywhere, not just the look detail page. */
function shareCurrentPage(){
  const url = location.href;
  const {view, param} = parseHash();
  const look = view==='look' ? LOOKS.find(l=>l.id===param) : null;
  const title = look ? `YONEX ${CATEGORIES[look.cat].label} — LOOK ${String(look.num).padStart(2,'0')}` : document.title;
  if(navigator.share){
    navigator.share({title, url}).catch(()=>{});
    return;
  }
  const done = () => showShareToast('링크가 복사되었습니다');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>{ legacyCopy(url); done(); });
  } else {
    legacyCopy(url); done();
  }
}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
let shareToastTimer = null;
function showShareToast(msg){
  let toast = document.getElementById('shareToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'shareToast';
    toast.className = 'share-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  requestAnimationFrame(()=>toast.classList.add('show'));
  clearTimeout(shareToastTimer);
  shareToastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}
function bindLookInteractions(id){
  const visual = document.getElementById('ldVisual');
  if(!visual) return;

  document.querySelectorAll('.ld-look-gtoggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>swapLookPair(id, btn.dataset.lg));
  });
  bindLookItemClicks(id);
  document.addEventListener('keydown', lookKeyNav);
  positionToggleThumb(document.querySelector('.ld-look-gtoggle'));
  positionToggleThumb(document.querySelector('.fl-toggle'));
  document.querySelectorAll('.ii-gtoggle').forEach(positionToggleThumb);
  bindDragScroll(document.querySelector('.ld-related-strip'));

  const detail = document.querySelector('.look-detail');
  const look = LOOKS.find(l=>l.id===id);
  let wasSwipe = false;

  /* prefetch the other gender's photo the moment a paired look opens,
     so the first MEN/WOMEN tap doesn't have to wait on a network fetch
     before the crossfade can even start. */
  if(look && look.pair){
    const other = lookPairView==='W' ? look : look.pair;
    new Image().src = other.fitImg || other.img;
  }

  /* Live finger-tracking swipe: the hero photo (and a peek underneath)
     follow the drag in real time instead of just reacting once on
     release — a released-then-canned-animation swipe has a dead zone the
     whole time your finger is moving, which is what actually read as
     choppy, not the release animation itself.
     A paired look has nothing to "go to next/prev" for on this screen
     any more — the related-looks carousel above the hero owns jumping to
     a different outfit — so drag/arrows/edge-taps toggle MEN/WOMEN
     instead; the peek is just whichever gender isn't showing. Unpaired
     looks keep the original prev/next-look behavior since there's no
     variant to toggle. */
  const DRAG_THRESHOLD = 70;
  let swipeX = null, swipeY = null, dragLocked = false, dragging = false, dragDX = 0, dragDir = null, dragPeek = null;

  function peekPhotoFor(dir){
    if(look && look.pair){
      const other = lookPairView==='W' ? look : look.pair;
      return other.fitImg || other.img;
    }
    const targetId = dir==='next' ? detail.dataset.next : detail.dataset.prev;
    const l = LOOKS.find(x=>x.id===targetId);
    return l ? (l.fitImg || l.img) : null;
  }
  function endDrag(){
    dragLocked = false; dragging = false; swipeX = null; swipeY = null;
  }

  visual.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY;
    dragLocked = false; dragging = false; dragDX = 0;
  }, {passive:true});

  visual.addEventListener('touchmove', e=>{
    if(swipeX===null || e.touches.length!==1 || REDUCE_MOTION) return;
    const dx = e.touches[0].clientX - swipeX;
    const dy = e.touches[0].clientY - swipeY;
    if(!dragLocked){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dragLocked = true;
      dragging = Math.abs(dx) > Math.abs(dy) * 1.3;
      if(dragging){
        dragDir = dx < 0 ? 'next' : 'prev';
        const photo = peekPhotoFor(dragDir);
        const img = document.getElementById('ldHeroImg');
        if(photo && img){
          dragPeek = document.createElement('img');
          dragPeek.className = 'ld-drag-peek';
          dragPeek.src = photo;
          dragPeek.alt = '';
          const cs = getComputedStyle(img);
          dragPeek.style.width = img.offsetWidth + 'px';
          dragPeek.style.height = img.offsetHeight + 'px';
          dragPeek.style.objectFit = cs.objectFit;
          dragPeek.style.objectPosition = cs.objectPosition;
          visual.insertBefore(dragPeek, img);
        }
      }
    }
    if(!dragging) return;
    e.preventDefault();
    dragDX = dx;
    const img = document.getElementById('ldHeroImg');
    if(img){
      img.style.transition = 'none';
      img.style.transform = `translateX(${dx}px)`;
    }
    if(dragPeek){
      const w = img ? img.offsetWidth : window.innerWidth;
      const off = dragDir==='next' ? w : -w;
      dragPeek.style.transition = 'none';
      dragPeek.style.transform = `translateX(${off + dx}px)`;
    }
  }, {passive:false});

  visual.addEventListener('touchend', ()=>{
    if(swipeX===null) return;
    const wasDragging = dragging;
    const dx = dragDX;
    const peek = dragPeek;
    const img = document.getElementById('ldHeroImg');
    dragPeek = null;
    endDrag();
    if(!wasDragging) return;
    wasSwipe = true;
    const committed = Math.abs(dx) > DRAG_THRESHOLD;
    const w = img ? img.offsetWidth : window.innerWidth;
    if(img){
      img.style.transition = 'transform .22s var(--ease-out)';
      img.style.transform = committed ? `translateX(${dragDir==='next' ? -w : w}px)` : 'translateX(0px)';
    }
    if(peek){
      peek.style.transition = 'transform .22s var(--ease-out)';
      peek.style.transform = committed ? 'translateX(0px)' : `translateX(${dragDir==='next' ? w : -w}px)`;
    }
    const isPaired = look && look.pair;
    const nextView = lookPairView==='W' ? 'M' : 'W';
    setTimeout(()=>{
      peek?.remove();
      if(img){
        /* must reset with transition:none, not '' — clearing the inline
           transition falls back to #ldHeroImg's own stylesheet rule
           (transition: transform .32s), and changing transform right
           after that takes effect animates the snap-back over 320ms
           instead of applying it instantly. That unintended slow drift
           back to center, arriving AFTER the swipe already visually
           finished, is what read as the photo "bouncing" into place. */
        img.style.transition = 'none';
        img.style.transform = '';
        /* the peek image already showed this exact (cached) photo in the
           same spot a moment ago — swap the src in the same tick as the
           reset so no frame shows the old photo snapping back first. */
        if(committed && isPaired){
          const nextVariant = nextView==='W' ? look.pair : look;
          img.src = nextVariant.fitImg || nextVariant.img;
        }
        void img.offsetWidth;
        img.style.transition = '';
      }
      if(committed){
        if(isPaired){
          swapLookPair(id, nextView, true);
        } else {
          const targetId = dragDir==='next' ? detail.dataset.next : detail.dataset.prev;
          window.__skipHeroAnim = true;
          go('look', targetId);
        }
      }
    }, 220);
  }, {passive:true});

  /* Pinch directly on the hero photo (before the lightbox is open): the
     first two-finger touch opens the lightbox and immediately continues
     the same gesture into zoom, so users don't need a tap first. */
  let pinchActive = false, pinchStartDist = 0, pinchStartScale = 1, wasPinch = false;
  visual.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      swipeX = null; swipeY = null;
      pinchActive = true; wasPinch = true;
      const img = document.getElementById('ldHeroImg');
      if(img && !document.getElementById('lightbox')?.classList.contains('show')){
        openLightbox(img.src, img.alt);
      }
      pinchStartDist = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      pinchStartScale = lbScale;
    }
  }, {passive:false});
  visual.addEventListener('touchmove', e=>{
    if(pinchActive && e.touches.length===2){
      e.preventDefault();
      const d = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      lbScale = Math.min(4, Math.max(1, pinchStartScale * (d / pinchStartDist)));
      const lbImg = document.getElementById('lightboxImg');
      if(lbImg) lbImg.style.transform = `translate(${lbPanX}px,${lbPanY}px) scale(${lbScale})`;
    }
  }, {passive:false});
  visual.addEventListener('touchend', e=>{
    if(pinchActive && e.touches.length<2){
      pinchActive = false;
      if(lbScale<=1.02){
        lbScale = 1; lbPanX = 0; lbPanY = 0;
        const lbImg = document.getElementById('lightboxImg');
        if(lbImg) lbImg.style.transform = '';
      }
    }
  }, {passive:true});

  visual.addEventListener('click', e=>{
    if(wasSwipe){ wasSwipe = false; return; }
    if(wasPinch){ wasPinch = false; return; }
    if(e.target.closest('.ec-arrow, .ld-gallery-dots')) return;
    /* the outer ~70px strip on either side of the photo is a tap zone —
       same idea as the arrows sitting there, just without needing to land
       exactly on the small circle — instead of merely blocking the zoom
       lightbox, a tap there does whatever the arrows do (toggle for a
       paired look, prev/next look otherwise). */
    const vr = visual.getBoundingClientRect();
    const inLeftZone = e.clientX - vr.left < 70;
    const inRightZone = vr.right - e.clientX < 70;
    if(inLeftZone || inRightZone){
      if(look && look.pair) swapLookPair(id, lookPairView==='W' ? 'M' : 'W');
      else go('look', inLeftZone ? detail.dataset.prev : detail.dataset.next);
      return;
    }
    const img = document.getElementById('ldHeroImg');
    if(img) openLightbox(img.src, img.alt);
  });
}
function openLightbox(src, alt){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = alt || '';
  lb.classList.add('show');
  resetLightboxZoom();

function closeLightbox(){
  document.getElementById('lightbox')?.classList.remove('show');

/* Custom pinch-to-zoom + pan for the lightbox image. The page's own
   viewport meta pins maximum-scale=1 (native pinch-zoom is off site-wide
   on purpose), so this re-implements pinch/pan by hand with touch events,
   scoped to just this one image. */
let lbScale = 1, lbPanX = 0, lbPanY = 0;
function resetLightboxZoom(){
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  const img = document.getElementById('lightboxImg');
  if(img) img.style.transform = '';
}
(function(){
  const img = document.getElementById('lightboxImg');
  if(!img) return;
  let startDist = 0, startScale = 1, dragging = false, dragStartX = 0, dragStartY = 0, dragStartPanX = 0, dragStartPanY = 0, lastTap = 0;
  const dist = (a,b) => Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
  function apply(){ img.style.transform = `translate(${lbPanX}px,${lbPanY}px) scale(${lbScale})`; }
  img.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      startDist = dist(e.touches[0], e.touches[1]);
      startScale = lbScale;
      dragging = false;
    } else if(e.touches.length===1 && lbScale>1){
      dragging = true;
      dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
      dragStartPanX = lbPanX; dragStartPanY = lbPanY;
    }
  }, {passive:false});
  img.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      lbScale = Math.min(4, Math.max(1, startScale * (dist(e.touches[0], e.touches[1]) / startDist)));
      apply();
    } else if(e.touches.length===1 && dragging){
      e.preventDefault();
      lbPanX = dragStartPanX + (e.touches[0].clientX - dragStartX);
      lbPanY = dragStartPanY + (e.touches[0].clientY - dragStartY);
      apply();
    }
  }, {passive:false});
  img.addEventListener('touchend', e=>{
    dragging = false;
    if(lbScale<=1.02){ lbScale=1; lbPanX=0; lbPanY=0; apply(); }
    if(e.touches.length===0 && e.changedTouches.length===1){
      const now = Date.now();
      if(now - lastTap < 300){
        if(lbScale>1){ resetLightboxZoom(); apply(); }
        else { lbScale=2; apply(); }
      }
      lastTap = now;
    }
  });
})();
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeLightbox();
});
function lookKeyNav(e){

}

/* keeps Tab/Shift+Tab cycling inside an open overlay (product modal, search
   panel) instead of leaking focus into the page behind it, and hands focus
   back to whatever triggered the overlay once it closes. */
let focusTrapEl = null, focusTrapReturn = null;
function trapFocusIn(panel){
  focusTrapEl = panel;
  focusTrapReturn = document.activeElement;
  document.addEventListener('keydown', onFocusTrapKey);
}
function releaseFocusTrap(panel, {restoreFocus = true} = {}){
  if(focusTrapEl !== panel) return;
  document.removeEventListener('keydown', onFocusTrapKey);
  if(restoreFocus && focusTrapReturn && document.contains(focusTrapReturn)) focusTrapReturn.focus();
  focusTrapEl = null;
  focusTrapReturn = null;
}
function onFocusTrapKey(e){
  if(e.key !== 'Tab' || !focusTrapEl) return;
  const items = [...focusTrapEl.querySelectorAll('button,a[href],input,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!items.length) return;
  const i = items.indexOf(document.activeElement);
  const next = e.shiftKey ? (i<=0 ? items.length-1 : i-1) : (i===-1 || i===items.length-1 ? 0 : i+1);
  e.preventDefault();
  items[next].focus();
}

/* ---------------- PRODUCT CODE SEARCH ----------------
   Header search: type a product code, get live matches across every LOOK
   (including the hidden gender-variant items inside look.pair), click/Enter
   jumps straight to that look's page (showing its model cut) — no separate
   "search page", just a jump. Results are ordered TOP items before BOTTOM
   items (then original look order) so e.g. searching "001" lists tops
   first, bottoms below. */
let searchActiveIdx = -1;
const SLOT_RANK = {top:0, bottom:1};
function searchProducts(query){
  const q = query.trim().toUpperCase();
  if(!q) return [];
  const seen = new Set();
  const results = [];
  LOOKS.forEach(look=>{
    const variants = look.pair ? [[false, look.items],[true, look.pair.items]] : [[false, look.items]];
    variants.forEach(([isPair, items])=>{
      items.forEach(it=>{
        const p = PRODUCTS[it.code];
        if(!p) return;
        const key = it.code.toUpperCase();
        const disp = p.code.toUpperCase();
        if(!key.includes(q) && !disp.includes(q)) return;
        const dedupe = look.id+'|'+isPair+'|'+it.code;
        if(seen.has(dedupe)) return;
        seen.add(dedupe);
        results.push({lookId:look.id, isPair, code:it.code, product:p, look, slot:it.slot});
      });
    });
  });
  results.sort((a,b)=>{
    const ra = SLOT_RANK[(a.slot||'').toLowerCase()] ?? 2;
    const rb = SLOT_RANK[(b.slot||'').toLowerCase()] ?? 2;
    return ra - rb;
  });
  return results.slice(0,8);
}
function onSearchInput(value){
  searchActiveIdx = -1;
  const box = document.getElementById('searchResults');
  if(!value.trim()){ box.innerHTML = ''; window.__searchResults = []; return; }
  const results = searchProducts(value);
  window.__searchResults = results;
  if(!results.length){ box.innerHTML = `<div class="search-empty">NO MATCHING PRODUCT CODE</div>`; return; }
  box.innerHTML = results.map((r,i)=>`
    <div class="search-row" data-idx="${i}" onclick="jumpToSearchResult(${i})">
      <div class="sr-figure"><img src="${r.product.img}" alt=""></div>
      <div class="sr-info">
        <div class="sr-code">${r.product.code}</div>
        <div class="sr-name" title="${r.product.color ? `${r.product.name} · ${r.product.color}` : r.product.name}">${r.product.color ? `${r.product.name} · ${r.product.color}` : r.product.name}</div>
      </div>
      <div class="sr-look">LOOK ${String(r.look.num).padStart(2,'0')}</div>
    </div>`).join('');
}
function onSearchKeydown(e){
  const box = document.getElementById('searchResults');
  const rows = box ? Array.from(box.querySelectorAll('.search-row')) : [];
  if(e.key==='Enter'){
    e.preventDefault();
    if(!rows.length) return;
    jumpToSearchResult(searchActiveIdx>=0 ? searchActiveIdx : 0);
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(!rows.length) return;
    searchActiveIdx = Math.min(searchActiveIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('active', i===searchActiveIdx));
    rows[searchActiveIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(!rows.length) return;
    searchActiveIdx = Math.max(searchActiveIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('active', i===searchActiveIdx));
    rows[searchActiveIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Escape'){
    closeSearch();
  }
}
function jumpToSearchResult(i){
  const hit = (window.__searchResults||[])[i];

  closeSearch();

    if(look && look.pair) swapLookPair(hit.lookId, hit.isPair ? 'W' : 'M');

  if(parseHash().view==='look' && parseHash().param===hit.lookId){
    finish();
  } else {
    window.addEventListener('hashchange', function once(){
      window.removeEventListener('hashchange', once);
      finish();
    }, {once:true});
    go('look', hit.lookId);
  }
}
function toggleSearch(){

function openSearch(){

   change data-active-code after the page rendered. The pool may not have

   and applied by paintMix() itself once MIX_TOPS/MIX_BOTTOMS are ready. */
let pendingMixTop = null, pendingMixBottom = null;
function openInStyleMix(itemEl){
  if(!itemEl) return;

  if(itemEl.dataset.slot === 'bottom') pendingMixBottom = code;
  else pendingMixTop = code;

/* Each layer (base/bottom/top) gets exactly ONE persistent <img>, created
   the first time it's needed and reused for every later swap — never a
   fresh node created and torn down per call. An earlier version did the
   latter with a whole crossfade/cleanup dance (fade the old node out,
   remove it after the transition), which turned out to be exactly what
   real-device WebKit chokes on: fetching+decoding a src directly on a
   stacked, absolutely-positioned <img> — especially several of them at
   once, which is exactly this preview's base+bottom+top layout — has
   been seen to leave the image permanently invisible, neither its
   decode() promise nor even its plain load event ever firing, no error
   surfaced either. That risk lives in the fetch+decode step itself, not
   in "stacked", so the fix is to move that step OFF the stack entirely:
   decode the image on a plain, detached Image() first (an ordinary,
   non-positioned element the bug doesn't touch), and only hand the
   result to the real, visible layer element once it's already fully
   loaded — at that point setting .src paints from cache essentially
   immediately. No-ops if the layer is already showing (or already
   loading) src. */
function mixSetLayer(preview, cls, src){
  let img = preview.querySelector(':scope > .'+cls);
  if(!img){
    img = document.createElement('img');
    img.className = cls;
    img.alt = '';
    preview.appendChild(img);
  }
  if(img.dataset.targetSrc === src) return;
  img.dataset.targetSrc = src;
  const preloader = new Image();
  preloader.onload = ()=>{
    if(img.dataset.targetSrc !== src) return; /* superseded by a later call */
    const commit = ()=>{
      img.src = src;
      requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.add('mp-in')));
    };
    if(img.classList.contains('mp-in')){
      img.classList.remove('mp-in'); /* fade the old garment out first */
      setTimeout(commit, 220);
    } else {
      commit();
    }
  };
  preloader.onerror = ()=>{
    if(img.dataset.targetSrc === src) preview.classList.add('mp-broken');
  };
  preloader.src = src;
}
/* One horizontally-scrollable strip per kind (TOP/BOTTOM) instead of a
   single item stepped through with arrows — every candidate is visible
   at a glance, tap any thumbnail to select it directly. */
function mixCarouselHtml(kind, codes, activeIdx){
  const thumbs = codes.map((code,i)=>{
    const p = PRODUCTS[code];
    if(!p) return '';
    const isActive = i===activeIdx;
    return `<button type="button" class="mix-thumb${isActive?' active':''}" onclick="selectMix('${kind}',${i})" aria-label="${p.name} ${p.code} ${p.color||''}" aria-pressed="${isActive}">
      <img src="${p.img}" alt="" loading="lazy">
    </button>`;
  }).join('');
  const active = PRODUCTS[codes[activeIdx]];
  return `<div class="mix-carousel" data-kind="${kind}">
    <div class="mc-info">
      <span class="mc-head">${kind.toUpperCase()}</span>
      <span class="mc-name">${active?.name||''}</span>
      <span class="mc-code">${active?.code||''} — ${active?.color||''}</span>
    </div>
    <div class="mc-row">
      <button type="button" class="mc-arrow mc-arrow-prev" onclick="stepMix('${kind}',-1)" aria-label="Previous ${kind}">&#8249;</button>
      <div class="mc-strip">${thumbs}</div>
      <button type="button" class="mc-arrow mc-arrow-next" onclick="stepMix('${kind}',1)" aria-label="Next ${kind}">&#8250;</button>
    </div>
  </div>`;

/* Arrow taps move the *selection* to the adjacent item (wrapping at the
   ends) and scroll just far enough to bring it into view — swiping/
   dragging the strip itself stays free scrolling, untouched by this. */
function stepMix(kind, dir){
  const list = kind==='top' ? MIX_TOPS : MIX_BOTTOMS;
  const curIdx = kind==='top' ? mixTopIdx : mixBottomIdx;
  const nextIdx = (curIdx + dir + list.length) % list.length;
  selectMix(kind, nextIdx);
  const strip = document.querySelector(`.mix-carousel[data-kind="${kind}"] .mc-strip`);
  const thumb = strip && strip.children[nextIdx];
  if(thumb) thumb.scrollIntoView({behavior: REDUCE_MOTION ? 'auto' : 'smooth', inline: 'nearest', block: 'nearest'});
}
function paintMix(){
  const stage = document.getElementById('mixStage');
  const cta = document.getElementById('mixCta');
  const preview = document.getElementById('mixPreview');
  if(!stage) return;
  applyPendingMixSelection();
  if(!MIX_TOPS.length || !MIX_BOTTOMS.length){
    stage.innerHTML = '<div class="mix-loading">업로드된 코디 이미지가 아직 없습니다</div>';
    if(cta) cta.innerHTML = '';
    if(preview) preview.innerHTML = '';
    return;
  }
  stage.innerHTML = mixCarouselHtml('top', MIX_TOPS, mixTopIdx) + mixCarouselHtml('bottom', MIX_BOTTOMS, mixBottomIdx);
  updateMixPreview();
}
/* Refreshes just the mannequin preview + CTA — used both by the initial
   full paintMix() render and by selectMix()'s lighter per-tap update,
   which deliberately leaves the carousel strips themselves untouched so
   picking an item further down a scrolled strip doesn't snap it back to
   the start. */
function updateMixPreview(){
  const cta = document.getElementById('mixCta');
  const preview = document.getElementById('mixPreview');
  const match = mixMatchLook();
  if(preview){
    preview.classList.remove('mp-broken');
    if(!preview.querySelector('.mp-fallback')){
      preview.insertAdjacentHTML('beforeend', '<div class="mp-fallback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><path d="M12 6.6v1.8"/><path d="M12 8.4 3.5 14.2a1.2 1.2 0 0 0 .68 2.18H19.8a1.2 1.2 0 0 0 .68-2.18L12 8.4Z"/><path d="M5 17.6h14"/></svg><span>미리보기 준비 중</span></div>');
    }
    mixSetLayer(preview, 'mp-base', 'images/mannequin/base.jpg');
    mixSetLayer(preview, 'mp-bottom', `images/mannequin/bottoms/${mixBottomCode()}.png`);
    mixSetLayer(preview, 'mp-top', `images/mannequin/tops/${mixTopCode()}.png`);
  }
  if(cta) cta.innerHTML = match
    ? `<button onclick="go('look','${match.id}')">VIEW STYLING &rarr;</button><div class="mc-note">LOOK ${String(match.num).padStart(2,'0')} 스타일링 있음</div>`
    : `<button disabled>VIEW STYLING</button><div class="mc-note">촬영된 조합 없음</div>`;
}
function selectMix(kind, idx){
  if(kind==='top'){ if(idx===mixTopIdx) return; mixTopIdx = idx; }
  else{ if(idx===mixBottomIdx) return; mixBottomIdx = idx; }
  const carousel = document.querySelector(`.mix-carousel[data-kind="${kind}"]`);
  if(carousel){
    const strip = carousel.querySelector('.mc-strip');
    const prevActive = strip.querySelector('.mix-thumb.active');
    if(prevActive){ prevActive.classList.remove('active'); prevActive.setAttribute('aria-pressed','false'); }
    const next = strip.children[idx];
    if(next){ next.classList.add('active'); next.setAttribute('aria-pressed','true'); }
    const p = PRODUCTS[kind==='top' ? mixTopCode() : mixBottomCode()];
    if(p){
      carousel.querySelector('.mc-name').textContent = p.name;
      carousel.querySelector('.mc-code').textContent = `${p.code} — ${p.color}`;
    }
  }
  updateMixPreview();
}

/* ---------------- REVEAL ON SCROLL ---------------- */
function observeReveal(){
  const items = document.querySelectorAll('.reveal:not(.in)');
  if(!items.length) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  items.forEach(el=>io.observe(el));
}

/* PWA install support — lets the site launch standalone (no browser
   chrome) from a home-screen icon. Registration failing (unsupported
   browser, blocked by embedding context) is silently harmless; the
   site works the same without it, just without offline/standalone. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* Add-to-home-screen nudge. Android/Chrome exposes a real install API
   (beforeinstallprompt) that turns "menu > install app" into one tap;
   iOS has no such API at all — Apple only allows the manual
   Share > Add to Home Screen flow — so iOS instead gets a one-time
   pointer toward that flow instead of a fake "install" button. */
(function(){
  const DISMISS_KEY = 'pwaBannerDismissed';
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  let dismissedAlready = false;
  try{ dismissedAlready = localStorage.getItem(DISMISS_KEY) === '1'; }catch(e){}
  if(isStandalone() || dismissedAlready) return;

  let banner = null;
  function ensureBanner(){
    if(banner) return banner;
    banner = document.createElement('div');
    banner.className = 'pwa-banner';
    banner.setAttribute('role','status');
    document.body.appendChild(banner);
    return banner;
  }
  function dismiss(){
    if(banner) banner.classList.remove('show');
    try{ localStorage.setItem(DISMISS_KEY, '1'); }catch(e){}
  }
  const closeBtnHtml = `<button type="button" class="pwa-close" aria-label="닫기"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button>`;
  function showBanner(html){
    const b = ensureBanner();
    b.innerHTML = html + closeBtnHtml;
    b.querySelector('.pwa-close').onclick = dismiss;
    requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('show')));
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(()=>{
      if(!deferredPrompt) return;
      showBanner(`<img class="pwa-icon" src="images/icons/icon-192.png?v=3" alt="">
        <div class="pwa-text"><b>앱처럼 설치하기</b>홈 화면에 추가하면 브라우저 없이 바로 실행돼요.</div>
        <button type="button" class="pwa-install-btn" id="pwaInstallBtn">설치</button>`);
      document.getElementById('pwaInstallBtn').onclick = async ()=>{
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice.catch(()=>{});
        deferredPrompt = null;
        dismiss();
      };
    }, 1500);
  });
  window.addEventListener('appinstalled', ()=>{
    deferredPrompt = null;
    dismiss();
  });

  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isIOS){
    setTimeout(()=>{
      if(deferredPrompt) return; /* shouldn't fire on iOS, but don't stack banners if it somehow did */
      showBanner(`<img class="pwa-icon" src="images/icons/icon-192.png?v=3" alt="">
        <div class="pwa-text"><b>앱처럼 설치하기</b>하단 공유 <span class="pwa-share-glyph"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span> 버튼 → "홈 화면에 추가"를 눌러주세요.</div>`);
    }, 1500);
  }
})();
</script>
