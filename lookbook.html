<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX 2026 F/W DIGITAL LOOKBOOK</title>
<meta name="description" content="YONEX 2026 Fall/Winter digital lookbook — model looks across Game Wear, Casual Wear and Easy Wear, with linked product ghost cuts.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121212'/><text x='50' y='68' font-family='Georgia,serif' font-weight='700' font-size='58' fill='%23F5F4F0' text-anchor='middle'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F6F5F1; --paper-3:#EFEDE6;
  --ink:#131313; --ink-soft:#4A4A46; --muted:#8C8B84;
  --line:rgba(19,19,19,.12); --line-soft:rgba(19,19,19,.07);
  --accent:#0C8F3D;
  --game:#C0402C; --casual:#33456B; --easy:#6E7A54;
  --sans:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.16,.8,.24,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
body{-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:var(--sans);}
::selection{background:var(--ink);color:var(--paper);}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

h1,h2,h3{font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance;}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.serifnum{font-family:var(--mono);}

/* ===== TOP NAV ===== */
header.topnav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}
.topnav-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 28px;}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:0;}
.brand .mark{width:26px;height:26px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:15px;flex:none;}
.brand .name{font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--ink);}
.brand .season{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;display:block;margin-top:1px;}
nav.catnav{display:flex;gap:2px;flex:1 1 auto;min-width:0;}
nav.catnav button{background:none;border:none;cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-soft);padding:9px 14px;transition:color .2s;position:relative;font-family:var(--sans);white-space:nowrap;}
nav.catnav button::after{content:'';position:absolute;left:14px;right:14px;bottom:5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease);}
nav.catnav button:hover,nav.catnav button.active{color:var(--ink);}
nav.catnav button.active::after{transform:scaleX(1);}
.mix-link{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;border:1px solid var(--ink);padding:8px 14px;cursor:pointer;background:none;color:var(--ink);transition:background .2s,color .2s;white-space:nowrap;flex:none;}
.mix-link:hover{background:var(--ink);color:var(--paper);}
@media(max-width:820px){.topnav-row{padding:13px 16px;gap:6px;flex-wrap:nowrap;} nav.catnav{gap:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-end;} nav.catnav::-webkit-scrollbar{display:none;} nav.catnav button{padding:8px 7px;font-size:9.5px;} .brand{flex:none;} .brand .name{display:none;} .mix-link{padding:7px 9px;font-size:9px;}}
@media(max-width:400px){nav.catnav button{padding:6px 4px;font-size:8.6px;} .mix-link{padding:6px 7px;font-size:8.1px;} .brand .season{display:none;}}

main#app{min-height:70vh;}
.view{animation:viewIn .5s var(--ease) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* ===== COVER ===== */
.cover{position:relative;height:100svh;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141414;}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;}
.cover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(8,8,8,.12) 45%,rgba(6,6,6,.88) 100%);}
.cover-in{position:relative;z-index:2;max-width:1320px;margin:0 auto;width:100%;padding:0 28px 64px;color:#fff;}
.cover-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.78);margin-bottom:18px;}
.cover h1{font-size:clamp(38px,7.4vw,92px);line-height:.98;color:#fff;letter-spacing:-.03em;text-transform:uppercase;max-width:980px;}
.cover-cats{display:flex;gap:0;margin-top:44px;border-top:1px solid rgba(255,255,255,.28);flex-wrap:wrap;}
.cover-cats button{flex:1 1 200px;text-align:left;background:none;border:none;border-right:1px solid rgba(255,255,255,.28);cursor:pointer;padding:20px 22px 22px;color:#fff;transition:background .25s;font-family:var(--sans);}
.cover-cats button:last-child{border-right:none;}
.cover-cats button:hover{background:rgba(255,255,255,.08);}
.cover-cats .cc-num{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.6);letter-spacing:.08em;}
.cover-cats .cc-name{display:block;font-size:19px;font-weight:700;margin-top:8px;letter-spacing:-.01em;}
.cover-cats .cc-arrow{display:inline-block;margin-left:8px;transition:transform .25s var(--ease);}
.cover-cats button:hover .cc-arrow{transform:translateX(4px);}
@media(max-width:640px){.cover{min-height:640px;} .cover-cats button{flex:1 1 100%;border-right:none;border-top:1px solid rgba(255,255,255,.2);} .cover-cats button:first-child{border-top:none;}}

/* ===== CATEGORY PAGE ===== */
.cat-hero{padding:72px 28px 20px;max-width:1320px;margin:0 auto;}
.cat-tags{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.cat-tags span{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--accent-cat);border:1px solid currentColor;padding:5px 11px;}
.cat-hero h2{font-size:clamp(34px,6vw,64px);letter-spacing:-.03em;text-transform:uppercase;}
.cat-hero p{font-size:15px;color:var(--ink-soft);margin-top:14px;max-width:480px;line-height:1.7;font-weight:300;}
.cat-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:26px;}

.look-grid{max-width:1320px;margin:0 auto;padding:36px 28px 110px;display:grid;grid-template-columns:repeat(2,1fr);gap:56px 32px;}
.look-card{cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.look-card.in{opacity:1;transform:translateY(0);}
.look-card .lc-frame{position:relative;overflow:hidden;background:var(--paper-2);aspect-ratio:4/5;}
.look-card .lc-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .7s var(--ease);}
.look-card:hover .lc-frame img{transform:scale(1.035);}
.look-card .lc-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;}
.look-card .lc-num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}
.look-card .lc-cap{font-size:15px;font-weight:600;margin-top:5px;}
.look-card .lc-view{font-family:var(--mono);font-size:10px;color:var(--accent-cat);letter-spacing:.06em;opacity:0;transition:opacity .25s;}
.look-card:hover .lc-view{opacity:1;}

/* category rhythm variants */
body[data-cat="game"] .look-grid,
body[data-cat="casual"] .look-grid{gap:70px 44px;grid-template-columns:repeat(2,1fr);}
body[data-cat="game"] .look-card .lc-frame,
body[data-cat="casual"] .look-card .lc-frame{aspect-ratio:4/5;}
body[data-cat="casual"] .look-card .lc-cap{font-weight:400;}
body[data-cat="easy"] .look-grid{gap:64px 40px;}
body[data-cat="easy"] .look-card .lc-frame{aspect-ratio:5/6;border-radius:2px;}
@media(max-width:760px){.look-grid{grid-template-columns:1fr 1fr;gap:28px 16px !important;} .cat-hero{padding:52px 18px 10px;} .look-grid{padding:26px 18px 80px;}}
@media(max-width:480px){.look-grid{grid-template-columns:1fr;}}

/* ===== FULL LINE-UP (all SKUs in a category) ===== */
.full-lineup{max-width:1320px;margin:0 auto;padding:0 28px 120px;border-top:1px solid var(--line-soft);}
.fl-head{display:flex;align-items:baseline;justify-content:space-between;padding:46px 0 30px;}
.fl-head h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;}
.fl-count{font-family:var(--mono);font-size:11px;color:var(--muted);}
.fl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px 18px;}
.fl-card{cursor:pointer;}
.fl-card .fl-frame{aspect-ratio:1/1;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s;}
.fl-card:hover .fl-frame{background:var(--paper-3);}
.fl-card .fl-frame img{max-width:82%;max-height:82%;object-fit:contain;transition:transform .3s var(--ease);}
.fl-card:hover .fl-frame img{transform:scale(1.04);}
.fl-card .fl-code{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:10px;letter-spacing:.02em;}
.fl-card .fl-sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;}
@media(max-width:980px){.fl-grid{grid-template-columns:repeat(4,1fr);gap:22px 14px;}}
@media(max-width:640px){.full-lineup{padding:0 18px 90px;} .fl-head{padding:34px 0 22px;} .fl-grid{grid-template-columns:repeat(3,1fr);gap:18px 10px;} .fl-card .fl-code{font-size:9.5px;} .fl-card .fl-sub{font-size:8.5px;}}

/* ===== LOOK DETAIL ===== */
.look-detail{max-width:1440px;margin:0 auto;padding:28px 28px 0;}
.ld-crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;padding:14px 0 26px;}
.ld-look-gtoggle{margin-left:auto;display:inline-flex;border:1px solid var(--ink);}
.ld-look-gtoggle button{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:7px 14px;background:none;border:none;cursor:pointer;color:var(--ink-soft);transition:background .18s,color .18s;}
.ld-look-gtoggle button:first-child{border-right:1px solid var(--ink);}
.ld-look-gtoggle button.active{background:var(--ink);color:var(--paper);}
@media(max-width:640px){.ld-look-gtoggle button{padding:6px 11px;font-size:9.5px;}}
.ld-crumb b{color:var(--ink);font-weight:700;}
.ld-crumb .sep{opacity:.4;}
.ld-split{display:grid;grid-template-columns:65fr 35fr;gap:0;align-items:stretch;min-height:78vh;border:1px solid var(--line-soft);}
.ld-visual{position:relative;background:var(--paper-3);overflow:hidden;min-height:420px;}
.ld-visual img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.ld-hotspot{position:absolute;pointer-events:none;opacity:0;transition:opacity .45s ease;border-radius:50%;background:radial-gradient(ellipse at center,var(--accent-cat-a) 0%,transparent 72%);filter:blur(2px);}
.ld-hotspot.active{opacity:1;}
.ld-hotspot .ring{position:absolute;inset:8%;border:1px solid var(--accent-cat);border-radius:46% 54% 52% 48%/50% 46% 54% 50%;opacity:0;transition:opacity .45s ease;}
.ld-hotspot.active .ring{opacity:.55;}
.ld-caption{position:absolute;left:24px;bottom:24px;color:#fff;z-index:2;}
.ld-caption .eyebrow{color:rgba(255,255,255,.75);}
.ld-caption h3{color:#fff;font-size:26px;margin-top:6px;letter-spacing:-.01em;}
.ld-visual .vscrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 30%);pointer-events:none;}
.swipe-hint{display:none;}

.ld-items{background:var(--paper);display:flex;flex-direction:column;border-left:1px solid var(--line-soft);}
.ld-item{flex:1;display:flex;flex-direction:column;padding:28px 30px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .25s;position:relative;}
.ld-item:last-child{border-bottom:none;}
.ld-item:hover,.ld-item.hover-active{background:var(--paper-2);}
.ld-item .ii-top{display:flex;justify-content:space-between;align-items:baseline;}
.ld-item .ii-slot{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent-cat);}
.ld-item .ii-idx{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.ld-item .ii-figure{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0;min-height:120px;}
.ld-item .ii-figure img{max-height:150px;width:auto;max-width:88%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(20,20,15,.10));transition:transform .35s var(--ease);}
.ld-item:hover .ii-figure img{transform:translateY(-3px) scale(1.02);}
.ld-item .ii-name{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.02em;}
.ld-item .ii-code{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;}
.ii-gtoggle{display:inline-flex;margin-top:12px;border:1px solid var(--line);}
.ii-gtoggle button{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;width:26px;height:22px;background:none;border:none;cursor:pointer;color:var(--muted);transition:background .18s,color .18s;}
.ii-gtoggle button:first-child{border-right:1px solid var(--line);}
.ii-gtoggle button.active{background:var(--ink);color:var(--paper);}

@media(max-width:980px){
  .ld-split{grid-template-columns:1fr;min-height:0;}
  .ld-visual{aspect-ratio:4/5;min-height:0;touch-action:pan-y;}
  .swipe-hint{display:flex;position:absolute;top:50%;width:30px;height:30px;align-items:center;justify-content:center;color:#fff;font-size:20px;line-height:1;z-index:3;pointer-events:none;}
  .swipe-hint.left{left:2px;animation:swipeHintL 2.2s ease-in-out infinite;}
  .swipe-hint.right{right:2px;animation:swipeHintR 2.2s ease-in-out infinite;}
  @keyframes swipeHintL{0%,100%{opacity:.32;transform:translate(0,-50%);}50%{opacity:.85;transform:translate(-5px,-50%);}}
  @keyframes swipeHintR{0%,100%{opacity:.32;transform:translate(0,-50%);}50%{opacity:.85;transform:translate(5px,-50%);}}
  .ld-items{border-left:none;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:repeat(2,1fr);}
  .ld-item{border-bottom:none;border-right:1px solid var(--line-soft);padding:20px 16px;}
  .ld-item:nth-child(2n){border-right:none;}
  .ld-item:nth-child(n+3){border-top:1px solid var(--line-soft);}
  .ld-item .ii-figure{min-height:0;padding:8px 0;}
  .ld-item .ii-figure img{max-height:96px;}
  .ld-item .ii-name{font-size:12.5px;}
  .ld-item .ii-code{font-size:10px;}
}

.ld-nav{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:28px 28px 90px;}
.ld-nav-btn{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;color:var(--ink);font-family:var(--sans);}
.ld-nav-btn .lb-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;}
.ld-nav-btn .lb-cap{font-size:14px;font-weight:600;margin-top:3px;}
.ld-nav-btn.next{text-align:right;flex-direction:row-reverse;}
.ld-nav-btn:hover .lb-cap{text-decoration:underline;text-underline-offset:4px;}
.ld-nav-mid{text-align:center;}
.ld-nav-mid .eyebrow{margin-bottom:4px;}
.ld-nav-mid .lm-num{font-family:var(--mono);font-size:13px;font-weight:700;}
@media(max-width:640px){
  .ld-nav{padding:22px 18px 60px;}
  .ld-nav-mid{display:none;}
  .ld-nav-btn .lb-cap{display:none;}
  .ld-nav-btn{gap:8px;}
  .ld-nav-btn .lb-lbl{font-size:11px;}
}

/* ===== WORN WITH ===== */
.worn-with{max-width:1440px;margin:0 auto;padding:0 28px 100px;}
.worn-with h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:20px;}
.ww-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;}
.ww-card{cursor:pointer;}
.ww-card .ww-frame{aspect-ratio:4/5;overflow:hidden;background:var(--paper-2);}
.ww-card .ww-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s var(--ease);}
.ww-card:hover .ww-frame img{transform:scale(1.04);}
.ww-card .ww-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:9px;}

/* ===== PRODUCT MODAL ===== */
.pm-backdrop{position:fixed;inset:0;background:rgba(15,14,12,.5);z-index:500;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.pm-backdrop.show{opacity:1;pointer-events:auto;}
.pm-panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:var(--paper);z-index:501;transform:translateX(100%);transition:transform .4s var(--ease);overflow-y:auto;box-shadow:-20px 0 50px rgba(0,0,0,.14);}
.pm-panel.show{transform:translateX(0);}
.pm-close{position:absolute;top:22px;right:24px;background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-soft);}
.pm-body{padding:74px 34px 50px;}
.pm-figure{background:var(--paper-2);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
.pm-figure img{max-width:74%;max-height:74%;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(20,20,15,.12));}
.pm-code{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;}
.pm-name{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em;}
.pm-row{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line-soft);font-size:13px;}
.pm-row span:first-child{color:var(--muted);}
.pm-detail-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin:26px 0 10px;}
.pm-detail-txt{font-size:13.5px;color:var(--ink-soft);line-height:1.75;font-weight:300;}
.pm-ww{margin-top:34px;}
.pm-ww h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px;}
.pm-ww-row{display:flex;gap:12px;}
.pm-ww-row .ww-mini{flex:1;cursor:pointer;}
.pm-ww-row .ww-mini .frame{aspect-ratio:4/5;background:var(--paper-2);overflow:hidden;}
.pm-ww-row .ww-mini .frame img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.pm-ww-row .ww-mini .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:6px;}

/* ===== MIX & MATCH ===== */
.mix-hero{max-width:1000px;margin:0 auto;padding:74px 28px 10px;text-align:center;}
.mix-hero .eyebrow{justify-content:center;display:flex;}
.mix-hero h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.03em;margin-top:14px;text-transform:uppercase;}
.mix-hero p{font-size:14.5px;color:var(--ink-soft);margin-top:14px;font-weight:300;}
.mix-stage{max-width:920px;margin:56px auto 0;padding:0 28px;}
.mix-slot{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;padding:14px 0;}
.mix-slot:first-of-type{padding-top:30px;border-top:1px solid var(--line-soft);}
.mix-slot:last-of-type{padding-bottom:30px;border-bottom:1px solid var(--line-soft);}
.mix-arrow{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;color:var(--ink-soft);transition:border-color .2s,color .2s;justify-self:center;}
.mix-arrow:hover{border-color:var(--ink);color:var(--ink);}
.mix-figure{text-align:center;}
.mix-figure .ms-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;}
.mix-figure .ms-imgwrap{height:196px;display:flex;align-items:center;justify-content:center;}
.mix-figure img{max-height:100%;max-width:70%;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(20,20,15,.12));}

/* ---------------- STATE / ROUTER ---------------- */
let mixTopIdx = 0, mixBottomIdx = 0;
let lookGenderView = 'M';

function go(view, param){
  location.hash = param ? `${view}/${param}` : view;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function parseHash(){
  const h = location.hash.replace('#','').split('/').filter(Boolean);
  return {view:h[0]||'cover', param:h[1]||null};
}

function render(){
  const {view, param} = parseHash();
  document.querySelectorAll('#catnav button').forEach(b=>b.classList.toggle('active', view==='category' && b.dataset.cat===param));
  document.body.dataset.cat = view==='category'||view==='look' ? (view==='category'?param:LOOKS.find(l=>l.id===param)?.cat) : '';
  const cat = document.body.dataset.cat;
  if(cat) document.documentElement.style.setProperty('--accent-cat', CATEGORIES[cat].accent);
  if(cat) document.documentElement.style.setProperty('--accent-cat-a', CATEGORIES[cat].accent+'33');
  window.scrollTo({top:0,behavior:'instant'});
  closeProduct();

  if(view==='look') lookGenderView = 'M';

  const app = document.getElementById('app');
  if(view==='category') app.innerHTML = renderCategory(param);
  else if(view==='look') app.innerHTML = renderLook(param);
  else if(view==='mix') app.innerHTML = renderMix();
  else app.innerHTML = renderCover();

  app.querySelector('.view')?.classList.add('view');
  observeReveal();
  if(view==='look') bindLookInteractions(param);
  if(view==='mix') paintMix();
}

/* re-paints the look view in place (no scroll reset, no hash change) — used by the
   whole-look M/W toggle so switching gender doesn't jump the page */
function paintLook(id){
  const app = document.getElementById('app');
  app.innerHTML = renderLook(id);
  app.querySelector('.view')?.classList.add('view');
  bindLookInteractions(id);
}

function itemFig(code){
  const p = PRODUCTS[code];
  return p ? p.img : 'images/products/placeholder.png';
}

/* resolves the M/W code pair for an item regardless of which side it.code points to */
function genderInfo(code){
  const p = PRODUCTS[code];
  if(!p || !p.pairCode) return null;
  const q = PRODUCTS[p.pairCode];
  if(!q) return null;
  return {
    m: p.gender==='Men' ? code : p.pairCode,
    w: p.gender==='Women' ? code : p.pairCode,
    active: p.gender==='Women' ? 'W' : 'M',
  };
}

function renderLook(id){
  const look = LOOKS.find(l=>l.id===id);
  if(!look) return renderCover();
  const c = CATEGORIES[look.cat];
  const catLooks = LOOKS.filter(l=>l.cat===look.cat);
  const idx = catLooks.findIndex(l=>l.id===id);
  const prev = catLooks[(idx-1+catLooks.length)%catLooks.length];
  const next = catLooks[(idx+1)%catLooks.length];

  const showW = lookGenderView==='W' && look.pair;
  const variant = showW ? {img:look.pair.fitImg||look.pair.img, model:look.pair.model, items:look.pair.items, hotspots:look.pair.hotspots||look.hotspots} : {...look, img:look.fitImg||look.img};

  const hotspotsHtml = Object.entries(variant.hotspots).map(([slot,r])=>
    `<div class="ld-hotspot" data-slot="${slot}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;"><span class="ring"></span></div>`
  ).join('');

  const itemsHtml = variant.items.map((it,i)=>{
    const p = PRODUCTS[it.code];
    const gi = !look.pair ? genderInfo(it.code) : null;
    const toggleHtml = gi
      ? `<div class="ii-gtoggle"><button type="button" class="${gi.active==='M'?'active':''}" data-g="M">M</button><button type="button" class="${gi.active==='W'?'active':''}" data-g="W">W</button></div>`
      : '';
    return `<div class="ld-item" data-slot="${it.slot.toLowerCase()}" data-active-code="${it.code}" data-code-m="${gi?gi.m:''}" data-code-w="${gi?gi.w:''}">
      <div class="ii-top"><span class="ii-slot">${it.slot}</span><span class="ii-idx">0${i+1} / 0${variant.items.length}</span></div>
      <div class="ii-figure"><img src="${itemFig(it.code)}" alt="${p?p.name:it.slot}"></div>
      <div class="ii-name">${it.code}</div>
      <div class="ii-code">${p?`${p.price.toLocaleString()}원 · ${p.color}`:''}</div>
      ${toggleHtml}
    </div>`;
  }).join('');

  const lookToggleHtml = look.pair ? `<div class="ld-look-gtoggle">
      <button type="button" class="${showW?'':'active'}" data-lg="M">MEN</button>
      <button type="button" class="${showW?'active':''}" data-lg="W">WOMEN</button>
    </div>` : '';

  return `<div class="view">
    <section class="look-detail" data-prev="${prev.id}" data-next="${next.id}" data-id="${id}">
      <div class="ld-crumb">
        <a href="#category/${look.cat}" onclick="event.preventDefault();go('category','${look.cat}')">${c.label}</a>
        <span class="sep">/</span><b>LOOK 0${look.num}</b>
        ${lookToggleHtml}
      </div>
      <div class="ld-split">
        <div class="ld-visual" id="ldVisual">
          <img src="${variant.img}" alt="${look.caption}">
          <div class="vscrim"></div>
          <span class="swipe-hint left">&lsaquo;</span>
          <span class="swipe-hint right">&rsaquo;</span>
          ${hotspotsHtml}
          <div class="ld-caption">
            <div class="eyebrow">${c.label} — LOOK 0${look.num}</div>
            <h3>${look.caption}</h3>
          </div>
        </div>
        <div class="ld-items">${itemsHtml}</div>
      </div>
    </section>
    <nav class="ld-nav">
      <button class="ld-nav-btn prev" onclick="go('look','${prev.id}')">
        <span>&larr;</span>
        <span><span class="lb-lbl">PREV LOOK</span><span class="lb-cap">${prev.caption}</span></span>
      </button>
      <div class="ld-nav-mid">
        <div class="eyebrow">${c.label}</div>
        <div class="lm-num">LOOK 0${look.num}</div>
      </div>
      <button class="ld-nav-btn next" onclick="go('look','${next.id}')">
        <span><span class="lb-lbl">NEXT LOOK</span><span class="lb-cap">${next.caption}</span></span>
        <span>&rarr;</span>
      </button>
    </nav>
    ${renderWornWithSection(look)}
  </div>`;
}

function wornWithFor(code, excludeLookId){
  return LOOKS.filter(l=>l.id!==excludeLookId && l.items.some(it=>it.code===code));
}

function renderWornWithSection(look){
  const codes = [...new Set(look.items.map(i=>i.code))];
  const related = [...new Map(codes.flatMap(code=>wornWithFor(code, look.id)).map(l=>[l.id,l])).values()];
  if(!related.length) return '';
  return `<section class="worn-with">
    <h4>WORN WITH — SAME PIECES, OTHER LOOKS</h4>
    <div class="ww-grid">
      ${related.map(l=>`
        <div class="ww-card" onclick="go('look','${l.id}')">
          <div class="ww-frame"><img src="${l.img}" alt="${l.caption}" loading="lazy"></div>
          <div class="ww-lbl">${CATEGORIES[l.cat].label} — LOOK 0${l.num}</div>
        </div>`).join('')}
    </div>
  </section>`;
}

function bindLookInteractions(id){
  const visual = document.getElementById('ldVisual');
  if(!visual) return;
  document.querySelectorAll('.ld-item').forEach(el=>{
    const slot = el.dataset.slot;
    const hs = visual.querySelector(`.ld-hotspot[data-slot="${slot}"]`);
    el.addEventListener('mouseenter', ()=>hs && hs.classList.add('active'));
    el.addEventListener('mouseleave', ()=>hs && hs.classList.remove('active'));

    el.addEventListener('click', e=>{
      if(e.target.closest('.ii-gtoggle')) return;
      openProduct(el.dataset.activeCode, id);
    });
    el.querySelectorAll('.ii-gtoggle button').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const code = btn.dataset.g==='M' ? el.dataset.codeM : el.dataset.codeW;
        const p = PRODUCTS[code];
        if(!p) return;
        el.dataset.activeCode = code;
        el.querySelector('.ii-figure img').src = itemFig(code);
        el.querySelector('.ii-name').textContent = code;
        el.querySelector('.ii-code').textContent = `${p.price.toLocaleString()}원 · ${p.color}`;
        el.querySelectorAll('.ii-gtoggle button').forEach(b=>b.classList.toggle('active', b===btn));
      });
    });
  });
  document.addEventListener('keydown', lookKeyNav);

  const detail = document.querySelector('.look-detail');
  detail.querySelectorAll('.ld-look-gtoggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      lookGenderView = btn.dataset.lg;
      paintLook(id);
    });
  });

  let swipeX = null, swipeY = null;
  visual.addEventListener('touchstart', e=>{
    swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY;
  }, {passive:true});
  visual.addEventListener('touchend', e=>{
    if(swipeX===null) return;
    const dx = e.changedTouches[0].clientX - swipeX;
    const dy = e.changedTouches[0].clientY - swipeY;
    if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)*1.5){
      go('look', dx < 0 ? detail.dataset.next : detail.dataset.prev);
    }
    swipeX = null; swipeY = null;
  }, {passive:true});
}
function lookKeyNav(e){
  const {view, param} = parseHash();
  if(view!=='look') return;
  const look = LOOKS.find(l=>l.id===param); if(!look) return;
  const catLooks = LOOKS.filter(l=>l.cat===look.cat);
  const idx = catLooks.findIndex(l=>l.id===param);
  if(e.key==='ArrowRight') go('look', catLooks[(idx+1)%catLooks.length].id);
  if(e.key==='ArrowLeft') go('look', catLooks[(idx-1+catLooks.length)%catLooks.length].id);
}

/* ---------------- PRODUCT MODAL ---------------- */
function openProduct(code, lookId){
  const p = PRODUCTS[code];
  if(!p) return;
  const related = wornWithFor(code, lookId).slice(0,3);
  document.getElementById('pmBody').innerHTML = `
    <div class="pm-figure"><img src="${p.img}" alt="${p.name}"></div>
    <div class="pm-code">${code}</div>
    <div class="pm-name">${p.name.toUpperCase()}</div>
    <div class="pm-row"><span>COLOR</span><span>${p.color}</span></div>
    <div class="pm-row"><span>SIZE</span><span>${p.size}</span></div>
    <div class="pm-row"><span>COLLECTION</span><span>${p.collection}</span></div>
    <div class="pm-detail-lbl">DETAIL</div>
    <div class="pm-detail-txt">${p.material}</div>
    ${related.length ? `<div class="pm-ww"><h5>WORN WITH</h5><div class="pm-ww-row">
      ${related.map(l=>`<div class="ww-mini" onclick="go('look','${l.id}')">
        <div class="frame"><img src="${l.img}" alt="${l.caption}"></div>
        <div class="lbl">LOOK 0${l.num}</div>
      </div>`).join('')}
    </div></div>` : ''}
  `;
  document.getElementById('pmBackdrop').classList.add('show');
  document.getElementById('pmPanel').classList.add('show');
}
function closeProduct(){
  document.getElementById('pmBackdrop')?.classList.remove('show');
  document.getElementById('pmPanel')?.classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeProduct(); });

function renderMix(){
  return `<div class="view">
    <section class="mix-hero">
      <span class="eyebrow">STYLE MIX</span>
      <h2>Build Your Own Look</h2>
      <p>Pair a top with a bottom from the Game Wear collection. If the combination exists as a styled look, you can jump straight to it.</p>

    <section class="mix-cta" id="mixCta"></section>
  </div>`;
}
function mixTopCode(){ return MIX_TOPS[mixTopIdx]; }
function mixBottomCode(){ return MIX_BOTTOMS[mixBottomIdx]; }
function mixMatchLook(){
  return LOOKS.find(l=>{
    const codes = l.items.map(i=>i.code);
    return codes.includes(mixTopCode()) && codes.includes(mixBottomCode());
  });
}
function paintMix(){
  const stage = document.getElementById('mixStage');
  const cta = document.getElementById('mixCta');
  if(!stage) return;
  const top = PRODUCTS[mixTopCode()], bottom = PRODUCTS[mixBottomCode()];
  stage.innerHTML = `
    <div class="mix-slot">
      <button class="mix-arrow" onclick="shiftMix('top',-1)">&larr;</button>
      <div class="mix-figure">
        <div class="ms-label">TOP</div>
        <div class="ms-imgwrap"><img src="${top.img}" alt="${top.name}"></div>
        <div class="ms-name">${top.name}</div>
        <div class="ms-code">${mixTopCode()} — ${top.color}</div>
      </div>
      <button class="mix-arrow" onclick="shiftMix('top',1)">&rarr;</button>
    </div>
    <div class="mix-plus">+</div>
    <div class="mix-slot">
      <button class="mix-arrow" onclick="shiftMix('bottom',-1)">&larr;</button>
      <div class="mix-figure">
        <div class="ms-label">BOTTOM</div>
        <div class="ms-imgwrap"><img src="${bottom.img}" alt="${bottom.name}"></div>
        <div class="ms-name">${bottom.name}</div>
        <div class="ms-code">${mixBottomCode()} — ${bottom.color}</div>
      </div>
      <button class="mix-arrow" onclick="shiftMix('bottom',1)">&rarr;</button>
    </div>`;
  const match = mixMatchLook();
  cta.innerHTML = match
    ? `<button onclick="go('look','${match.id}')">VIEW STYLING &rarr;</button><div class="mc-note">Styled as ${CATEGORIES[match.cat].label} — LOOK 0${match.num}</div>`
    : `<button disabled>VIEW STYLING</button><div class="mc-note">No styled photo for this pairing yet</div>`;
}
function shiftMix(which, dir){
  if(which==='top') mixTopIdx = (mixTopIdx + dir + MIX_TOPS.length) % MIX_TOPS.length;
  else mixBottomIdx = (mixBottomIdx + dir + MIX_BOTTOMS.length) % MIX_BOTTOMS.length;
  paintMix();
}
/* touch swipe on mix figures */
let touchX = null;
document.addEventListener('touchstart', e=>{
  if(e.target.closest('.mix-figure')) touchX = e.touches[0].clientX;
});
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const fig = e.target.closest('.mix-figure');
  if(fig && Math.abs(dx) > 40){
    const which = fig.querySelector('.ms-label').textContent === 'TOP' ? 'top' : 'bottom';
    shiftMix(which, dx < 0 ? 1 : -1);
  }
  touchX = null;
});

/* ---------------- REVEAL ON SCROLL ---------------- */
function observeReveal(){
  const items = document.querySelectorAll('.reveal:not(.in)');
  if(!items.length) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  items.forEach(el=>io.observe(el));
}
</script>
