<style>
:root{
  --paper:#FFFFFF; --paper-2:#F6F5F1; --paper-3:#EFEDE6;
  --ink:#131313; --ink-soft:#4A4A46; --muted:#706F6A;
  --line:rgba(19,19,19,.12); --line-soft:rgba(19,19,19,.07);
  --accent:#0C8F3D;
  --game:#D2240C; --casual:#194193; --easy:#4B8043;
  --sans:'Chivo','Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Archivo','Noto Sans KR',var(--sans);
  --ease:cubic-bezier(.16,.8,.24,1);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
img[loading="lazy"]{opacity:0;transition:opacity .5s var(--ease-out);}
img[loading="lazy"].img-loaded{opacity:1;}
button{font-family:var(--sans);touch-action:manipulation;}
::selection{background:var(--ink);color:var(--paper);}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.serifnum{font-family:var(--mono);}

.skip-link{position:absolute;left:16px;top:-60px;z-index:300;padding:12px 20px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:700;font-size:13px;border-radius:8px;transition:top .2s var(--ease-out);}
.skip-link:focus-visible{top:16px;}

/* ===== TOP NAV ===== */
header.topnav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}
.topnav-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 28px 10px;}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:0;}
.brand .mark{height:16px;width:auto;flex:none;display:block;}
.brand .name{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);}
.brand .season{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;display:block;margin-top:1px;}
/* STYLE MIX + share + search as one right-aligned cluster, so a second
   flex child in .topnav-row (not three loose ones) is what space-between
   pushes to the far edge — kept together rather than spread apart. */
.topnav-right{display:flex;align-items:center;gap:10px;flex:none;}
/* every control in this cluster shares one height (set explicitly,
   not derived from padding) so the bordered STYLE MIX button lines up
   exactly with the icon squares beside it instead of running shorter. */
.mix-link{display:inline-flex;align-items:center;justify-content:center;height:34px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;border:1px solid var(--ink);padding:0 16px;cursor:pointer;background:none;color:var(--ink);transition:background .2s,color .2s;white-space:nowrap;flex:none;}
.mix-link:hover{background:var(--ink);color:var(--paper);}
.search-wrap{position:relative;flex:none;}
.search-toggle{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .15s ease;}
.search-toggle:hover{border-color:var(--ink);color:var(--ink);}
.search-toggle:active{transform:scale(.96);}
.search-panel{position:absolute;top:calc(100% + 10px);right:0;width:340px;max-width:calc(100vw - 32px);background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(20,20,15,.14);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out),visibility .2s;z-index:250;}
.search-panel.open{opacity:1;visibility:visible;transform:translateY(0);}
.search-input-row{display:flex;align-items:center;gap:8px;padding:10px;}
.search-field{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.search-field input:focus-visible{outline:none;}
.search-field .search-icon{flex:none;color:var(--muted);}
.search-field input{flex:1;min-width:0;border:none;background:none;padding:10px 0;font-family:var(--sans);font-size:13px;color:var(--ink);}
.search-field input::placeholder{color:var(--muted);}
.search-close{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.search-close:hover{color:var(--ink);background:var(--line-soft);}
.search-results{max-height:340px;overflow-y:auto;}
.search-results:not(:empty){border-top:1px solid var(--line-soft);}
.search-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .15s;}
.search-row:last-child{border-bottom:none;}
.search-row:hover,.search-row.active{background:var(--paper-2);}
.search-row .sr-figure{width:36px;height:36px;flex:none;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.search-row .sr-figure img{max-width:100%;max-height:100%;object-fit:contain;}
.search-row .sr-info{min-width:0;flex:1;}
.search-row .sr-code{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink);}
.search-row .sr-name{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-row .sr-look{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;flex:none;}
.search-empty{padding:16px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
/* its own full-width row below the logo/utility row, not squeezed into
   the same line — scales to more categories later without shrinking
   text or fighting STYLE MIX/share/search for room. flex-start (not the
   flex-end this used to need to hug the row's trailing edge) keeps the
   natural left-to-right reading order so the first category is what's
   visible by default, with overflow-x:auto/scroll as the safety net
   once there are more categories than fit. */
.catnav-row{display:flex;gap:26px;max-width:1320px;margin:0 auto;padding:14px 28px 16px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;}
.catnav-row::-webkit-scrollbar{display:none;}
.catnav-row button{background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);padding:0 0 4px;font-family:var(--display);text-transform:uppercase;white-space:nowrap;position:relative;flex:none;transition:color .2s;}
.catnav-row button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease);}
.catnav-row button:hover,.catnav-row button.active{color:var(--ink);}
.catnav-row button.active::after{transform:scaleX(1);background:var(--accent-cat);}
@media(max-width:820px){.topnav-row{padding:13px 16px 8px;gap:6px;flex-wrap:nowrap;} .brand{flex:none;} .brand .name{display:none;} .topnav-right{gap:6px;} .mix-link{height:30px;padding:0 12px;font-size:11px;} .search-toggle{width:30px;height:30px;} .search-panel{position:fixed;top:58px;left:12px;right:12px;width:auto;max-width:none;} .search-field input{font-size:16px;letter-spacing:-.03em;} .search-field input::placeholder{letter-spacing:-.03em;} .catnav-row{padding:12px 16px 12px;gap:20px;} .catnav-row button{font-size:12px;}}
/* phone-width only: at wider mobile/tablet sizes space-between opens
   up gaps between the tabs wide enough to read as disconnected rather
   than balanced — flex-start (its default above) reads fine there since
   the row already has real breathing room. Narrow enough to make GAME
   WEAR/EASY WEAR meet the row's edges (matching the utility row above
   it) only where the row is genuinely tight. */
@media(max-width:480px){.catnav-row{justify-content:space-between;}}
@media(max-width:400px){.brand .season{display:none;} .search-toggle{width:26px;height:26px;} .mix-link{height:26px;padding:0 10px;font-size:10px;} .catnav-row{gap:16px;} .catnav-row button{font-size:11px;}}

main#app{min-height:70vh;transition:opacity .22s var(--ease-out),transform .22s var(--ease-out),filter .22s var(--ease-out);}
main#app.app-out{opacity:0;transform:translateY(-8px);filter:blur(3px);}
.view{animation:viewIn .45s var(--ease-out) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(4px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}

/* ===== COVER ===== */
.cover{position:relative;height:100svh;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141414;}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;}
.cover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(8,8,8,.12) 45%,rgba(6,6,6,.88) 100%);}
.cover-in{position:relative;z-index:2;max-width:1320px;margin:0 auto;width:100%;padding:0 28px 64px;color:#fff;}
.cover h1{font-size:clamp(38px,7.4vw,92px);line-height:.98;color:#fff;letter-spacing:-.03em;text-transform:uppercase;max-width:980px;}
/* the season line is part of the headline block itself now, not a
   separate small-label-floating-above-a-big-headline "chip" — that
   shape reads as the default AI-generated hero template. Tightly
   attached as the h1's own first line instead, like a magazine
   masthead's issue line sitting directly on the title. */
.cover h1 .cover-season{display:block;font-family:var(--mono);font-size:clamp(13px,1.7vw,16px);font-weight:500;letter-spacing:.14em;text-transform:none;color:rgba(255,255,255,.68);margin-bottom:12px;}
.cover-cats{display:flex;gap:0;margin-top:44px;border-top:1px solid rgba(255,255,255,.28);flex-wrap:wrap;}
.cover-cats button{flex:1 1 200px;text-align:left;background:none;border:none;border-right:1px solid rgba(255,255,255,.28);cursor:pointer;padding:20px 22px 22px;color:#fff;transition:background .25s,transform .15s ease;font-family:var(--sans);}
.cover-cats button:last-child{border-right:none;}
.cover-cats button:hover{background:rgba(255,255,255,.08);}
.cover-cats button:active{transform:scale(.96);background:rgba(255,255,255,.13);}
.cover-cats .cc-num{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.6);letter-spacing:.08em;}
.cover-cats .cc-name{display:block;font-size:19px;font-weight:700;margin-top:8px;letter-spacing:-.01em;transition:transform .3s var(--ease);}
.cover-cats button:hover .cc-name{transform:translateX(3px);}
.cover-cats .cc-arrow{display:inline-block;margin-left:8px;transition:transform .25s var(--ease);}
.cover-cats button:hover .cc-arrow{transform:translateX(4px);}
@media(max-width:640px){.cover{min-height:640px;} .cover-cats button{flex:1 1 100%;border-right:none;border-top:1px solid rgba(255,255,255,.2);} .cover-cats button:first-child{border-top:none;}}

/* ===== CATEGORY PAGE ===== */
.cat-hero{padding:72px 28px 20px;max-width:1320px;margin:0 auto;}
.cat-tags{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.cat-tags span{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--accent-cat);padding:5px 11px;}
.cat-hero h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.03em;text-transform:uppercase;}
.cat-hero p{font-size:15px;color:var(--ink-soft);margin-top:14px;max-width:480px;line-height:1.7;font-weight:300;text-wrap:pretty;}
.cat-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:26px;}

.look-grid{max-width:1320px;margin:0 auto;padding:36px 28px 110px;display:grid;grid-template-columns:repeat(2,1fr);gap:56px 32px;}
.look-card{cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(min(var(--i,0),7) * 55ms);}
.look-card.in{opacity:1;transform:translateY(0);}
.look-card .lc-frame{position:relative;overflow:hidden;background:var(--paper-2);aspect-ratio:4/5;border:1px solid var(--line-soft);transition:transform .15s ease,border-color .2s;}
.look-card .lc-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .7s var(--ease);}
.look-card:active .lc-frame{transform:scale(.96);}
.look-card .lc-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;}
.look-card .lc-num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}
.look-card .lc-cap{font-size:15px;font-weight:600;margin-top:5px;}
.look-card .lc-view{font-family:var(--mono);font-size:10px;color:var(--accent-cat);letter-spacing:.06em;opacity:0;transition:opacity .25s;}
/* touch has no real hover; gated so tapping a card doesn't leave the
   zoomed photo/VIEW label stuck on until the next tap elsewhere */
@media(hover:hover) and (pointer:fine){
  .look-card:hover .lc-frame img{transform:scale(1.035);}
  .look-card:hover .lc-view{opacity:1;}
}

/* category rhythm variants */
body[data-cat="game"] .look-grid,
body[data-cat="casual"] .look-grid{gap:70px 44px;grid-template-columns:repeat(2,1fr);}
body[data-cat="game"] .look-card .lc-frame,
body[data-cat="casual"] .look-card .lc-frame{aspect-ratio:4/5;}
body[data-cat="casual"] .look-card .lc-cap{font-weight:400;}
body[data-cat="easy"] .look-grid{gap:64px 40px;}
body[data-cat="easy"] .look-card .lc-frame{aspect-ratio:5/6;border-radius:2px;}
/* desktop: 2 columns at 1320px container width makes each look photo
   ~600px wide — too large. 4 across reads as a proper grid instead. */
@media(min-width:1024px){body[data-cat] .look-grid{grid-template-columns:repeat(4,1fr);gap:48px 28px;}}
@media(max-width:760px){.look-grid{grid-template-columns:1fr 1fr;gap:28px 16px !important;} .cat-hero{padding:52px 18px 10px;} .cat-hero p{font-size:13.5px;line-height:1.6;margin-top:10px;} .look-grid{padding:26px 18px 80px;}}
@media(max-width:480px){.look-grid{grid-template-columns:1fr;}}

/* fallback shown in place of a look/product photo once lookImgTag()'s whole
   filename-guess chain has failed (see imgChainNext()) -- an empty img box
   otherwise renders the browser's native broken-image icon, which reads as
   a bug rather than "photo not uploaded yet". */
.img-missing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center;background:var(--paper-3);color:var(--muted);}
.img-missing svg{opacity:.45;flex:none;}
.img-missing span{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;line-height:1.4;}

/* ===== CAMPAIGN (editorial carousel) ===== */
.editorial-carousel{max-width:1320px;margin:0 auto;padding:44px 28px 0;}
.ec-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;}
.ec-head h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;}
.ec-count{font-family:var(--mono);font-size:11px;color:var(--muted);}
.ec-featured{position:relative;aspect-ratio:21/9;overflow:hidden;cursor:pointer;background:var(--paper);transition:opacity .32s var(--ease);}
.ec-featured.ec-swap{opacity:0;}
.ec-featured .ec-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(34px) brightness(.82) saturate(1.1);transform:scale(1.18);}
.ec-featured .ec-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .5s var(--ease);}
.ec-featured:hover .ec-fg{transform:scale(1.02);}
.ec-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 35%);pointer-events:none;}
.ec-featured-cap{position:absolute;left:24px;bottom:22px;color:#fff;z-index:2;}
.ec-featured-cap .eyebrow{color:rgba(255,255,255,.75);}
.ec-featured-cap h3{color:#fff;font-size:24px;margin-top:6px;letter-spacing:-.01em;}
.ec-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;font-size:19px;line-height:1;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s ease;}
/* invisible hit-area extension: the visible circle stays 42px (34px on
   mobile), but taps in a wider ring around it still land on the button
   instead of falling through to the hero's zoom-open click handler */
.ec-arrow::before{content:'';position:absolute;inset:-14px;}
.ec-arrow:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.75);}
.ec-arrow:active{transform:translateY(-50%) scale(.96);}
.ec-arrow-prev{left:16px;}
.ec-arrow-next{right:16px;}
.ec-strip{display:none;gap:10px;margin-top:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.ec-strip::-webkit-scrollbar{display:none;}
.ec-thumb{flex:0 0 calc((100% - 70px)/8);aspect-ratio:4/5;cursor:pointer;scroll-snap-align:start;overflow:hidden;background:var(--paper-3);border:1px solid transparent;transition:border-color .2s,transform .15s ease,opacity .2s ease;}
.ec-thumb.active{border-color:var(--ink);opacity:.55;}
.ec-thumb:active{transform:scale(.96);}
.ec-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;}
@media(max-width:760px){
  .editorial-carousel{padding:18px 18px 0;}
  .ec-featured{aspect-ratio:4/5;background:var(--paper-3);}
  .ec-featured .ec-bg{display:none;}
  .ec-featured .ec-fg{object-fit:cover;object-position:50% 18%;}
  .ec-featured-cap h3{font-size:20px;}
  .ec-thumb{flex-basis:62px;}
  .ec-strip{gap:7px;}
  .ec-arrow{width:34px;height:34px;font-size:15px;}
  .ec-arrow-prev{left:10px;}
  .ec-arrow-next{right:10px;}
}

/* ===== FULL LINE-UP (all SKUs in a category) ===== */
.full-lineup{max-width:1320px;margin:0 auto;padding:0 28px 120px;border-top:1px solid var(--line-soft);}
.fl-head{display:flex;align-items:baseline;justify-content:space-between;padding:46px 0 30px;flex-wrap:wrap;gap:14px;}
.fl-head h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;}
.fl-head-right{display:flex;align-items:center;gap:16px;flex:1 1 100%;justify-content:space-between;}
.fl-toggle{position:relative;display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);}
.fl-toggle button{position:relative;z-index:1;font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:5px 13px;background:none;border:none;border-radius:999px;cursor:pointer;color:var(--muted);transition:color .25s var(--ease-out),transform .15s ease;}
.fl-toggle button.active{color:var(--paper);}
.fl-toggle button:active{transform:scale(.96);}
.fl-count{font-family:var(--mono);font-size:11px;color:var(--muted);}
.fl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px 18px;}
.fl-card{position:relative;cursor:pointer;opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:calc(min(var(--i,0),9) * 45ms);}
/* a plain full-cover hit target instead of making the whole card a
   role="button" — that would nest the real swatch <button>s below inside
   an element ARIA treats as a button, which forbids interactive content.
   Sits under the swatches (z-index) so their own clicks still land on
   them, not on this. */
.fl-open{position:absolute;inset:0;z-index:0;margin:0;padding:0;border:none;background:none;cursor:pointer;}
.fl-card.in{opacity:1;transform:translateY(0);}
.fl-card.fl-hide{opacity:0 !important;transform:scale(.92) !important;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);}
/* the press-scale lives on .fl-card itself, not .fl-frame — giving
   .fl-frame its own transform on :active promotes it to a stacking
   context, which (since it sits after .fl-open in source order) then
   paints ABOVE .fl-open and swallows the tap before it ever reaches
   the open button. Scaling the whole card avoids creating that extra
   context between them. */
.fl-card:active{transform:scale(.97);}
.fl-card .fl-frame{aspect-ratio:1/1;background:var(--paper);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .2s,transform .15s ease;}
.fl-card .fl-frame img{max-width:95.5%;max-height:95.5%;object-fit:contain;transition:transform .3s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .fl-card:hover .fl-frame{border-color:var(--ink-soft);}
  .fl-card:hover .fl-frame img{transform:scale(1.04);}
}
/* .loose-crop marks a product-photo container whose source image (an
   "...EX"-coded item — a separate product line, shot with noticeably
   more padding around the garment than the site's own 263-prefixed
   items) reads visibly smaller than its neighbors despite object-fit
   sizing them identically. Zooms it back in line; each selector restates
   its own existing hover-zoom as the combined (base × hover) transform
   rather than layering on top, same reasoning as the daily-wear photo
   fix — otherwise hovering would replace this zoom with a smaller one. */
.fl-card .fl-frame.loose-crop img{transform:scale(1.25);}
.ld-item .ii-figure.loose-crop img{transform:scale(1.25);}
.pm-figure.loose-crop img{transform:scale(1.25);}
@media(hover:hover) and (pointer:fine){
  .fl-card:hover .fl-frame.loose-crop img{transform:scale(1.3);}
  .ld-item:hover .ii-figure.loose-crop img{transform:translateY(-3px) scale(1.275);}
}
.fl-card .fl-code{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:10px;letter-spacing:.02em;}
.fl-card .fl-sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;}
.fl-swatches{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
/* the swatch dot stays visually small; ::before extends the actual hit
   area to the WCAG 2.5.8 24x24px minimum without touching a neighbor's
   (extension is capped at half the 8px gap on each side) */
.fl-swatch{position:relative;width:16px;height:16px;padding:0;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.14);box-shadow:0 0 0 1px var(--paper) inset;transition:transform .15s var(--ease),box-shadow .15s;}
.fl-swatch::before{content:'';position:absolute;inset:-4px;}
.fl-swatch:hover{transform:scale(1.12);}
.fl-swatch:active{transform:scale(.96);}
.fl-swatch.active{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink);}
@media(max-width:980px){.fl-grid{grid-template-columns:repeat(4,1fr);gap:22px 14px;}}
@media(max-width:640px){.full-lineup{padding:0 18px 90px;} .fl-head{padding:34px 0 22px;} .fl-grid{grid-template-columns:repeat(3,1fr);gap:18px 10px;} .fl-card .fl-code{font-size:9.5px;} .fl-card .fl-sub{font-size:8.5px;}}

/* ===== LOOK DETAIL ===== */
.look-detail{max-width:900px;margin:0 auto;padding:20px 28px 48px;}
.ld-crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;padding:14px 0 8px;}
.ld-back{color:var(--ink);font-weight:700;text-decoration:none;transition:opacity .2s;}
.ld-back:hover{opacity:.6;}
.ld-crumb h1{display:inline;margin:0;color:var(--ink);font-size:inherit;font-family:inherit;font-weight:700;text-transform:none;letter-spacing:normal;text-wrap:initial;}
.ld-crumb .sep{opacity:.4;}
.ld-look-gtoggle{position:relative;margin-left:auto;display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);}
.ld-look-gtoggle button{position:relative;z-index:1;font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:5px 13px;background:none;border:none;border-radius:999px;cursor:pointer;color:var(--muted);transition:color .25s var(--ease-out);}
.ld-look-gtoggle button.active{color:var(--paper);}
/* min-height used to be a flat 78vh with no cap — combined with
   .look-detail's old 1440px max-width, the wide visual column stretched
   the portrait hero photo (object-fit:cover, no explicit aspect-ratio) to
   whatever height that width implied, well past a screenful on a normal
   desktop window. The real fix is .look-detail's narrower max-width below
   (900px keeps the photo's natural ~4:5 crop around 680px tall); this is
   just the floor so very short item-panel content never collapses it. */
.ld-split{display:grid;grid-template-columns:65fr 35fr;grid-template-rows:auto auto;gap:0;align-items:stretch;min-height:min(78vh,680px);border:1px solid var(--line-soft);}
/* declared here (ahead of the @media(max-width:980px) block below) so that
   block's mobile grid-column/padding override for .ld-nav-mid actually
   wins on mobile — two same-specificity rules resolve by source order, and
   this one previously sat after the media block, silently cancelling it. */
.ld-nav-mid{grid-column:1/-1;grid-row:2;padding:4px 28px;border-top:1px solid var(--line-soft);}
.ld-visual{grid-column:1;grid-row:1;position:relative;background:var(--paper-3);overflow:hidden;min-height:420px;cursor:zoom-in;}
.ld-visual img{width:100%;height:100%;object-fit:cover;object-position:top center;}
/* the next/prev photo revealed underneath as a finger drags the current
   one aside — gives the swipe live, continuous feedback instead of a
   dead zone until release, which is what actually read as "choppy". */
.ld-drag-peek{position:absolute;left:0;top:0;z-index:1;pointer-events:none;}
#ldHeroImg{position:relative;z-index:2;}
/* a snapshot of the outgoing hero photo, held in place over the old spot
   with no animation of its own while the fresh page renders underneath —
   without it the old photo just vanishes on DOM swap and the new one is
   blank until it finishes loading. render() removes it in one hard cut
   the instant the incoming photo is actually ready (see the isLookToLook
   block below) — a crossfade and then a full-width slide were both tried
   here and explicitly didn't land, so this is intentionally motion-free. */
.ld-hero-ghost{position:fixed;z-index:250;pointer-events:none;}
.ld-gallery-dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;gap:4px;}
/* the button itself is a larger invisible hit area (touch-target sizing);
   the visible dot mark is a fixed-size ::after so enlarging the tap target
   doesn't change how the indicator actually looks. */
.ld-dot{width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ld-dot::after{content:'';width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.25);transition:background .2s,transform .15s ease;}
.ld-dot.active::after{background:#fff;}
.ld-dot:active::after{transform:scale(.85);}
.ld-caption{position:absolute;left:24px;bottom:24px;color:#fff;z-index:4;}
.ld-caption .eyebrow{color:rgba(255,255,255,.75);}
.ld-caption h3{color:#fff;font-size:26px;margin-top:6px;letter-spacing:-.01em;}
.ld-visual .vscrim{position:absolute;inset:0;z-index:3;background:linear-gradient(0deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 30%);pointer-events:none;}

/* the item panel's per-card padding/figure size were tuned for a narrow
   single-column mobile flow. On desktop, .ld-items stacks vertically
   beside the hero photo and CSS grid's align-items:stretch forces the
   photo to match whatever height the item stack naturally needs — with
   two generously-padded 200px-tall figures, that stack alone could run
   past 700px, dragging the (object-fit:cover) photo into an oversized,
   over-zoomed crop along with it. Trimmed so the panel's natural desktop
   height lands close to the .ld-split floor instead of driving past it. */
.ld-items{grid-column:2;grid-row:1;background:var(--paper);display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line-soft);transition:opacity .2s var(--ease-out);}
.ld-items.ld-items-fading{opacity:0;}
.ld-item{flex:0 0 auto;display:flex;flex-direction:column;padding:22px 28px;border-right:none;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .25s;position:relative;}
.ld-item:last-child{border-bottom:none;}
.ld-item.hover-active{background:var(--paper-2);}
.ld-item .ii-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.ld-item .ii-slot{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent-cat);}
.ld-item .ii-figure{width:100%;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.ld-item .ii-figure img{max-height:100%;max-width:70%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(20,20,15,.10));transition:transform .35s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .ld-item:hover{background:var(--paper-2);}
  .ld-item:hover .ii-figure img{transform:translateY(-3px) scale(1.02);}
}
.ld-item .ii-name{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em;text-align:right;margin-top:14px;}
.ld-item .ii-color{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;text-align:right;}
.ld-item .ii-code{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px;text-align:right;}
.ii-gtoggle{position:relative;display:inline-flex;align-self:flex-start;margin-top:12px;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);}
.ii-gtoggle button{position:relative;z-index:1;font-family:var(--display);font-size:9px;font-weight:600;letter-spacing:.03em;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:none;border:none;cursor:pointer;color:var(--muted);transition:color .2s var(--ease-out);}
.ii-gtoggle button.active{color:var(--paper);}
.ii-mix-link{display:inline-flex;align-items:center;align-self:flex-start;gap:5px;padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink-soft);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .15s ease;}
.ii-mix-link svg{flex:none;}
.ii-mix-link:hover{border-color:var(--accent-cat);color:var(--accent-cat);}
.ii-mix-link:active{transform:scale(.96);}

@media(max-width:980px){
  .ld-split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;min-height:0;}
  .ld-visual{grid-column:1;grid-row:1;aspect-ratio:4/5;min-height:0;touch-action:pan-y;}
  .ld-nav-mid{grid-column:1;grid-row:2;min-width:0;padding-left:0;padding-right:0;}
  .ld-items{grid-column:1;grid-row:3;min-width:0;flex-direction:row;border-left:none;border-top:1px solid var(--line-soft);}
  .ld-item{flex:1;min-width:0;padding:10px 12px;border-right:1px solid var(--line-soft);border-bottom:none;}
  .ld-item:last-child{border-right:none;}
  .ld-item .ii-top{margin-bottom:6px;}
  .ld-item .ii-figure{display:none;}
  .ld-item .ii-name{font-size:15px;margin-top:0;overflow-wrap:break-word;}
  .ld-item .ii-color{font-size:11px;margin-top:4px;}
  .ld-item .ii-code{font-size:11px;margin-top:2px;overflow-wrap:break-word;}
  .ii-mix-link{padding:6px;}
  .ii-mix-link span{display:none;}
}

.ld-nav{max-width:1320px;margin:0 auto;padding:28px 28px 90px;}
/* .ld-nav-mid reuses .ld-nav's spacing but, as a grid item inside .ld-split,
   needs to actually fill its column — the auto side margins above are meant
   for .ld-nav's own standalone (non-grid) usage and would otherwise stop
   this item from stretching, sizing it to its content instead and clipping
   whatever doesn't fit. */
.ld-nav-mid{margin:0;}
/* the same strip, sitting between the hero photo and the item panel as a
   "pick a different outfit" picker instead of a "here's more" afterthought
   at the very top of the page (before the user has even seen the look
   they clicked into) — needs its own (much shorter) top/bottom spacing
   instead of the standalone .ld-nav's, plus dividers so it doesn't
   visually run into the hero above or the item panel below. On desktop
   .ld-split's two hero/item columns stay side by side; this sits full-
   width in its own row underneath both rather than between them, since
   there's no side-by-side equivalent of "between" to put it in. */
/* mouse users have no swipe gesture for this horizontal strip — cursor:grab
   plus bindDragScroll() (JS) lets a click-and-drag scroll it the way a
   touch swipe already does on mobile. scroll-snap is suspended mid-drag
   (.dragging) so the strip tracks the cursor 1:1 instead of fighting the
   snap points. */
.ld-related-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab;user-select:none;}
.ld-related-strip::-webkit-scrollbar{display:none;}
.ld-related-strip.dragging{cursor:grabbing;scroll-snap-type:none;}
.ld-related-thumb{flex:0 0 calc((100% - 70px)/8.4);aspect-ratio:4/5;cursor:pointer;scroll-snap-align:start;overflow:hidden;background:var(--paper-3);border:1px solid var(--line-soft);transition:border-color .3s var(--ease-out),transform .15s ease;}
.ld-related-thumb:active{transform:scale(.96);}
.ld-related-thumb.active{border:1.5px solid var(--ink);}
.ld-related-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .4s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .ld-related-thumb:hover{border-color:var(--ink-soft);}
  .ld-related-thumb:hover img{transform:scale(1.05);}
}
@media(max-width:640px){
  .ld-nav{padding:22px 18px 60px;}
  .ld-nav-mid{padding:2px 0;}
  .ld-related-strip{gap:8px;}
  .ld-related-thumb{flex:0 0 calc((100% - 40px)/5.2);}
  .look-detail{padding:16px 18px 16px;}
  .fl-head{padding:36px 0 22px;}
}

/* ===== PRODUCT MODAL ===== */
.pm-backdrop{position:fixed;inset:0;background:rgba(15,14,12,.5);z-index:500;opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);}
.pm-backdrop.show{opacity:1;pointer-events:auto;}
.pm-panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:var(--paper);z-index:501;transform:translateX(100%);transition:transform .4s var(--ease-drawer);overflow-y:auto;box-shadow:-20px 0 50px rgba(0,0,0,.14);}
.pm-panel.show{transform:translateX(0);}
.pm-close{position:absolute;top:22px;right:24px;background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-soft);transition:transform .25s var(--ease),color .2s;}
.pm-close:hover{transform:rotate(90deg);color:var(--ink);}
/* ===== LIGHTBOX (tap-to-enlarge look photo) ===== */
.lightbox{position:fixed;inset:0;background:rgba(10,10,9,.94);z-index:600;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out);cursor:zoom-out;}
.lightbox.show{opacity:1;pointer-events:auto;}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;box-shadow:0 30px 70px rgba(0,0,0,.4);touch-action:none;cursor:zoom-in;}
.lightbox-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:none;border:none;cursor:pointer;font-size:26px;line-height:1;color:#F5F4F0;opacity:.8;transition:opacity .2s,transform .25s var(--ease);}
.lightbox-close:hover{opacity:1;transform:rotate(90deg);}
.share-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;padding:11px 20px;border-radius:999px;box-shadow:0 14px 32px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .22s var(--ease-out),transform .22s var(--ease-out);z-index:500;}
.share-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(prefers-reduced-motion:reduce){.share-toast{transition:opacity .01ms;}}

/* Add-to-home-screen prompt: Android gets a real one-tap install via
   beforeinstallprompt; iOS has no such API (Apple only allows the
   manual Share > Add to Home Screen flow), so it gets a guided nudge
   toward that instead. Both share one bottom-sheet-style banner. */
.pwa-banner{position:fixed;left:16px;right:16px;bottom:16px;z-index:400;max-width:420px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.28);transform:translateY(140%);opacity:0;transition:transform .32s var(--ease-out),opacity .32s var(--ease-out);}
.pwa-banner.show{transform:translateY(0);opacity:1;}
.pwa-banner .pwa-icon{width:38px;height:38px;border-radius:10px;flex:none;display:block;}
.pwa-banner .pwa-text{flex:1;min-width:0;font-size:12px;line-height:1.45;color:rgba(255,255,255,.82);}
.pwa-banner .pwa-text b{display:block;font-family:var(--display);font-weight:800;font-size:13px;color:var(--paper);text-transform:uppercase;letter-spacing:.01em;margin-bottom:2px;}
.pwa-banner .pwa-text .pwa-share-glyph{display:inline-flex;vertical-align:-3px;margin:0 2px;}
.pwa-banner button.pwa-install-btn{flex:none;background:var(--paper);color:var(--ink);border:none;padding:9px 14px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:transform .15s ease;}
.pwa-banner button.pwa-install-btn:active{transform:scale(.96);}
.pwa-banner button.pwa-close{flex:none;background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;}
@media(prefers-reduced-motion:reduce){.pwa-banner{transition:opacity .01ms;}}
@media(max-width:420px){.pwa-banner{left:10px;right:10px;bottom:10px;}}
.pm-body{padding:74px 34px 50px;}
.pm-figure{background:var(--paper);border:1px solid var(--line-soft);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin-bottom:28px;touch-action:pan-y;}
.pm-figure img{max-width:74%;max-height:74%;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(20,20,15,.12));transition:transform .3s var(--ease),opacity .25s var(--ease);}
.pm-figure img.pm-fig-swap{opacity:0;}
.pm-view-toggle{position:relative;display:flex;width:fit-content;margin:-14px auto 24px;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);}
.pm-view-toggle button{position:relative;z-index:1;font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:5px 13px;background:none;border:none;border-radius:999px;cursor:pointer;color:var(--muted);transition:color .25s var(--ease-out);}
.pm-view-toggle button.active{color:var(--paper);}
/* shared sliding "thumb" for pill toggles (FRONT/BACK, MEN/WOMEN, gender
   filters) — one element physically slides/resizes between button
   positions instead of each button independently fading its own fill. */
.toggle-thumb{position:absolute;left:0;top:3px;height:calc(100% - 6px);background:var(--ink);border-radius:999px;transition:transform .28s var(--ease-out),width .28s var(--ease-out);z-index:0;pointer-events:none;}
.ii-gtoggle .toggle-thumb{top:2px;height:calc(100% - 4px);}
.pm-code{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em;}
.pm-name{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.01em;line-height:1.15;}
.pm-line{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:6px;}
.pm-line + .pm-line{margin-top:1px;}
.pm-line-world{font-weight:700;font-size:13px;}
.pm-note-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;}
.pm-note{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.03em;}
/* Apple-style spec grid: label small/muted above, value larger below,
   laid out in columns rather than a left-label/right-value list row. */
.pm-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 18px;margin-top:30px;padding:24px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
.pm-spec{display:flex;flex-direction:column;gap:7px;min-width:0;}
.pm-spec-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);}
.pm-spec-value{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.3;}
.pm-swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.pm-swatch{width:20px;height:20px;padding:0;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.14);box-shadow:0 0 0 1px var(--paper) inset;transition:transform .15s var(--ease),box-shadow .15s;}
.pm-swatch:hover{transform:scale(1.1);}
.pm-swatch:active{transform:scale(.96);}
.pm-swatch.active{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink);}
.pm-detail-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin:28px 0 10px;}
.pm-detail-txt{font-size:13.5px;color:var(--ink-soft);line-height:1.7;font-weight:400;white-space:pre-line;}
.pm-ww{margin-top:34px;}
.pm-ww h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px;}
.pm-ww-row{display:flex;gap:12px;}
.pm-ww-row .ww-mini{flex:1;cursor:pointer;}
.pm-ww-row .ww-mini .frame{aspect-ratio:4/5;background:var(--paper-2);overflow:hidden;}
.pm-ww-row .ww-mini .frame img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.pm-ww-row .ww-mini .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:6px;}
/* mobile: compact the panel so photo through DETAIL material text
   fits in one screen without scrolling — shorter figure frame,
   tighter padding/row spacing throughout */
@media(max-width:640px){
  .pm-close{top:12px;right:14px;}
  .pm-body{padding:44px 22px 26px;}
  .pm-figure{aspect-ratio:3/2;margin-bottom:10px;}
  .pm-view-toggle{margin:-6px auto 14px;}
  .pm-name{font-size:21px;}
  .pm-specs{grid-template-columns:repeat(2,1fr);gap:18px 14px;margin-top:14px;padding:16px 0;}
  .pm-spec-value{font-size:14.5px;}
  .pm-detail-lbl{margin:12px 0 6px;}
  .pm-note-row{margin-top:8px;}
}

/* ===== MIX & MATCH ===== */
.mix-hero{max-width:1000px;margin:0 auto;padding:40px 28px 8px;text-align:center;}
.mix-hero h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.03em;text-transform:uppercase;}
/* same treatment as the home hero's season line — part of the
   headline's own first line, not a separate small-label-above-big-
   headline "chip" sitting apart from it. */
.mix-hero h1 .mix-kicker{display:block;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:none;color:var(--muted);margin-bottom:10px;}
.mix-preview{position:relative;width:280px;aspect-ratio:6/7;margin:20px auto 0;background:var(--paper-2);border-radius:4px;overflow:hidden;}
/* Pure opacity crossfade only — no scale/translate here. These layers
   (base/bottom/top) are pre-aligned PNGs meant to sit pixel-registered
   on the same mannequin canvas; a scale "settle" effect looks nice on
   a single standalone image, but on a *stack* of independently
   transitioning layers it moves each garment's edges at a different
   rate than its neighbors mid-transition, which briefly opens a
   visible seam/gap between e.g. the shirt hem and the shorts
   waistband — that's what read as jerky and "overlapping". */
.mix-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s linear;}
.mix-preview img.mp-in{opacity:1;}
.mix-preview .mp-base{z-index:1;}
.mix-preview .mp-bottom{z-index:2;}
.mix-preview .mp-top{z-index:3;}
.mix-preview .mp-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:20px;}
.mix-preview .mp-fallback svg{width:36px;height:36px;opacity:.55;}
.mix-preview-note{max-width:280px;margin:8px auto 0;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;}
.mix-preview.mp-broken img{visibility:hidden;}
.mix-preview.mp-broken .mp-fallback{display:flex;}
.mix-stage{max-width:920px;margin:18px auto 0;padding:0 28px;}
.mix-loading{padding:30px 0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);}
.mix-carousel{padding:14px 0;border-top:1px solid var(--line-soft);}
.mix-carousel:last-of-type{border-bottom:1px solid var(--line-soft);}
.mc-row{display:flex;align-items:center;gap:6px;}
.mc-strip{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.mc-strip::-webkit-scrollbar{display:none;}
.mix-thumb{flex:0 0 calc((100% - 40px)/5);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:4px;border:1px solid var(--line-soft);border-radius:4px;background:var(--paper);cursor:pointer;scroll-snap-align:start;transition:border-color .3s var(--ease-out),transform .15s ease;}
.mix-thumb:active{transform:scale(.96);}
.mix-thumb.active{border:1.5px solid var(--ink);}
.mix-thumb img{max-width:100%;max-height:100%;object-fit:contain;}
@media(hover:hover) and (pointer:fine){
  .mix-thumb:hover{border-color:var(--ink-soft);}
}
.mc-arrow{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1;transition:background .2s,border-color .2s,color .2s,transform .15s ease;}
.mc-arrow:active{transform:scale(.9);}
@media(hover:hover) and (pointer:fine){
  .mc-arrow:hover{background:var(--ink);border-color:var(--ink);color:var(--paper);}
}
.mix-carousel .mc-info{margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.mix-carousel .mc-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);}
.mix-carousel[data-kind="top"] .mc-head{color:#194193;}
.mix-carousel[data-kind="bottom"] .mc-head{color:#55914C;}
.mix-carousel .mc-name{font-size:14px;font-weight:600;}
.mix-carousel .mc-code{font-family:var(--mono);font-size:11px;color:var(--muted);}
.mix-cta{text-align:center;padding:26px 28px 90px;}
.mix-cta button{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;padding:12px 30px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:opacity .2s,transform .15s ease;}
.mix-cta button:not(:disabled):active{transform:scale(.96);}
.mix-cta button:disabled{background:none;color:var(--muted);border-color:var(--line);cursor:default;}
.mix-cta button:not(:disabled):hover{opacity:.8;}
.mix-cta .mc-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:14px;}
.mix-body{max-width:1160px;margin:0 auto;}
/* laptop/tablet: mannequin preview and the ghost-cut top/bottom picker
   sit side by side instead of stacked, with the mannequin enlarged */
@media(min-width:760px){
  .mix-body{display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(300px,1fr);gap:8px 36px;align-items:center;padding:0 28px;}
  .mix-visual{position:sticky;top:84px;}
  .mix-preview{width:100%;max-width:480px;margin:20px auto 0;}
  .mix-preview-note{max-width:480px;}
  .mix-stage{max-width:none;margin:18px 0 0;padding:0;}
  .mix-cta{padding:26px 0 40px;}
}
@media(max-width:640px){
  .mix-visual{padding:0 16px;}
  .mix-preview{width:100%;max-width:420px;margin:14px auto 0;}
  .mix-preview-note{max-width:420px;margin:6px auto 0;}
  .mix-stage{padding:0 16px;margin:10px auto 0;}
  .mix-thumb{padding:3px;}
  .mix-cta{padding:16px 0 40px;}
  .mix-cta .mc-note{margin-top:10px;}
}

footer.lb-foot{border-top:1px solid var(--line-soft);padding:34px 28px;text-align:center;}
footer.lb-foot .eyebrow{justify-content:center;display:flex;text-transform:none;letter-spacing:.04em;}
</style>

/* Positions the sliding .toggle-thumb behind the currently .active button
   of a pill-toggle group (FRONT/BACK, MEN/WOMEN, gender filters). Creates
   the thumb on first call. Safe to call after any render or state change;
   no-ops if the container or an active button isn't present. Wrapped in
   rAF so it reads layout after the browser has painted the new markup. */
/* runs synchronously (no rAF) so a freshly-inserted toggle gets its thumb
   sized and positioned before the browser's first paint — deferring this
   to a later frame left a visible gap where the toggle showed no active
   fill at all, then the pill popped in a frame later, reading as a flicker
   every time a look-detail page (and its toggles) got rebuilt on nav. */
function positionToggleThumb(container){
  if(!container) return;
  /* these pill groups (FRONT/BACK, MEN/WOMEN, gender filters) carry their
     selected state only through the sliding thumb's color contrast — a
     screen reader has no way to tell which button is current. Syncing
     aria-pressed here, once, covers every pill-toggle group in the site
     through this one shared positioning call. */
  container.querySelectorAll(':scope > button').forEach(b=>{
    b.setAttribute('aria-pressed', b.classList.contains('active') ? 'true' : 'false');
  });
  const active = container.querySelector(':scope > button.active');
  if(!active) return;
  let thumb = container.querySelector(':scope > .toggle-thumb');
  const justCreated = !thumb;
  if(!thumb){
    thumb = document.createElement('span');
    thumb.className = 'toggle-thumb';
    container.insertBefore(thumb, container.firstChild);
  }
  if(justCreated){
    /* a brand-new thumb (every full look-to-look re-render rebuilds this
       toggle from scratch) starts with no explicit width — on real
       hardware the browser can composite that default near-zero-width
       state for a frame before these styles land, and since width/
       transform are both transitioned properties, WebKit can then
       visibly animate FROM that wrong start instead of just appearing
       already-correct. That read as the pill "jumping toward MEN" (MEN's
       position sits near the default left-origin, so the same glitch is
       invisible there) right before settling on WOMEN. Suppress the
       transition for this first-ever positioning so it snaps straight
       to place; the CSS transition still runs normally afterwards, for
       the actual MEN/WOMEN tap. */
    thumb.style.transition = 'none';
  }
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = `translateX(${active.offsetLeft}px)`;
  if(justCreated){
    void thumb.offsetWidth;
    thumb.style.transition = '';
  }
}

/* Click-and-drag scroll for horizontal strips (currently the related-looks
   strip) — the touch swipe those already support has no mouse equivalent,
   so a desktop user with no touchscreen has no way to reach anything past
   the first screenful. mousemove/mouseup are bound once at module scope
   (not inside bindDragScroll) since bindLookInteractions calls this fresh
   on every render; per-element listeners used to be fine to re-add
   unguarded since every render's .ld-related-strip was a brand new
   element — that's no longer guaranteed now that a same-category
   look-to-look navigation deliberately reuses the previous strip node
   (see render()) to avoid re-triggering every thumbnail's lazy-load
   fade-in, so a bound marker is needed to keep this idempotent on a
   node that outlives more than one render. */
let dragScrollEl = null, dragScrollDown = false, dragScrollStartX = 0, dragScrollStartLeft = 0, dragScrollMoved = false;
function bindDragScroll(el){
  if(!el || el.dataset.dragBound) return;
  el.dataset.dragBound = '1';
  el.addEventListener('mousedown', e=>{
    if(e.button !== 0) return;
    dragScrollEl = el;
    dragScrollDown = true;
    dragScrollMoved = false;
    dragScrollStartX = e.clientX;
    dragScrollStartLeft = el.scrollLeft;
  });
  el.addEventListener('click', e=>{
    if(dragScrollMoved){
      e.preventDefault();
      e.stopPropagation();
      dragScrollMoved = false;
    }
  }, true);
  el.addEventListener('dragstart', e=>e.preventDefault());
}
window.addEventListener('mousemove', e=>{
  if(!dragScrollDown || !dragScrollEl) return;
  const dx = e.clientX - dragScrollStartX;
  if(!dragScrollMoved && Math.abs(dx) > 4){
    dragScrollMoved = true;
    dragScrollEl.classList.add('dragging');
  }
  if(dragScrollMoved){
    e.preventDefault();
    dragScrollEl.scrollLeft = dragScrollStartLeft - dx;
  }
});
window.addEventListener('mouseup', ()=>{
  if(!dragScrollDown) return;
  dragScrollDown = false;
  dragScrollEl?.classList.remove('dragging');
});

   that could ever appear here. The pool never needs editing just to
   surface a new upload: MIX_TOPS/MIX_BOTTOMS below are the subset of
   this pool that actually has a mannequin cutout uploaded, computed
   at runtime by probing each candidate's image. Bottom pool is
   ordered 263-prefix codes first, then 261-prefix codes. */
/* 263TS029/263TS029-2 and 263TS031/263TS031-2 are each one product code
   (263TS029M, 263TS031M) with a second color photo under the "-2"
   suffix — kept adjacent to their base code below so the carousel
   groups a product's color variants together instead of interleaving
   them with an unrelated product in between. */
const MIX_TOP_POOL = ['263TS001','263TS003','263TS005','263TS007','263TS009','263TS011','263TS013','263TS015','263TS057','263TS017','263TS019','263TS021','263TS023','263TS025','263TS027','263TS029','263TS029-2','263TS031','263TS031-2','263TR001','263TR002','263WU001','263WU002','263WU003'];
const MIX_BOTTOM_POOL = ['263PH001','263PH001-2','263PH002','263PH002-2','263PL001','263PL002','263WP001','263WP002','263WP003','263WP005','263WP006','263WP007','263WP008','263WP009','263WP010','261PH001M-1','261PH001M-1-2','261PH001M-1-3','261PH001M-1-4','261PH002F-1','261PH002F-1-2','261PH002F-1-3','261PH002F-1-4','261PH003M-1','261PH003M-1-2','261PH003M-1-3','261PH004F-1','261PH004F-1-2','261PH004F-1-3','261PH005M-1','261PH006F-1','261PH009U-1'];
/* subset of the pools above with a confirmed uploaded image, filled
   in by initMixPool() */
let MIX_TOPS = [], MIX_BOTTOMS = [];
let mixPoolPromise = null;
function mixImgExists(src){
  return fetch(src, {method:'HEAD'}).then(r=>r.ok).catch(()=>false);
}
function initMixPool(){
  if(mixPoolPromise) return mixPoolPromise;
  mixPoolPromise = Promise.all([
    Promise.all(MIX_TOP_POOL.map(code=>mixImgExists(`images/mannequin/tops/${code}.png`).then(ok=>ok?code:null))),
    Promise.all(MIX_BOTTOM_POOL.map(code=>mixImgExists(`images/mannequin/bottoms/${code}.png`).then(ok=>ok?code:null))),
  ]).then(([tops,bottoms])=>{
    /* a cold-started PWA can fire all ~55 of these existence probes before
       the network is really warmed up, spuriously failing every single one
       even though the files are all really there — falling back to the
       full (unfiltered) pool in that case keeps the mannequin preview from
       silently going blank, rather than trusting an all-failed result. */
    MIX_TOPS = tops.filter(Boolean);
    if(!MIX_TOPS.length) MIX_TOPS = [...MIX_TOP_POOL];
    MIX_BOTTOMS = bottoms.filter(Boolean);
    if(!MIX_BOTTOMS.length) MIX_BOTTOMS = [...MIX_BOTTOM_POOL];
    if(mixTopIdx >= MIX_TOPS.length) mixTopIdx = 0;
    if(mixBottomIdx >= MIX_BOTTOMS.length) mixBottomIdx = 0;
    refreshLookMixButtons();
  });
  return mixPoolPromise;
}
/* kicked off eagerly (not just on first STYLE MIX visit) so the LOOK
   page's own "STYLE MIX" jump buttons — which need MIX_TOPS/MIX_BOTTOMS
   to know which item codes actually have a mannequin cutout — have a
   real answer well before a user reaches one, instead of only after
   they've already visited /mix once this session. initMixPool() itself
   is memoized, so this doesn't cause a second round of requests later.
   Deferred to idle time rather than fired at script-parse time: ~55
   concurrent HEAD requests competing with the page's own first paint
   (hero photo, fonts, etc.) for a cold load's limited connections was
   itself a source of things feeling occasionally slow/janky on mobile.
   requestIdleCallback isn't available in Safari, hence the setTimeout
   fallback — same intent (let the real page settle first), just a fixed
   short delay instead of a true idle signal. */
if('requestIdleCallback' in window) requestIdleCallback(initMixPool, {timeout: 2000});
else setTimeout(initMixPool, 300);

let mixTopIdx = 0, mixBottomIdx = 0;
let lookGalleryIdx = 0;
let lookPairView = 'M';
let itemsSwapToken = 0;

const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* used on <a href="#..."> tiles that also drive go()'s custom page
   transition: a plain click still gets the transition, while a
   modified click (open in new tab/window) or middle-click falls
   through to the browser's native link handling untouched */
function navClick(e, view, param){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;
  e.preventDefault();
  go(view, param);
}
function go(view, param){
  const target = param ? `${view}/${param}` : view;
  if(location.hash.replace('#','') === target) return;
  const app = document.getElementById('app');
  /* going from one LOOK straight to another (prev/next arrows, related-looks
     strip, swipe, keyboard nav) skips the whole-page fade-out — render()
     gives that case its own lighter, hero-photo-only transition instead of
     dipping the entire section (breadcrumb, item panel, everything) to
     nothing and back, which read as the whole page flickering. */
  const isLookToLook = view==='look' && parseHash().view==='look';
  if(isLookToLook || !app || !app.children.length || REDUCE_MOTION){
    location.hash = target;
  } else {
    app.classList.add('app-out');
    setTimeout(()=>{ location.hash = target; }, 190);
  }
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

/* fade lazy-loaded images in once decoded, instead of a hard pop-in
   as they scroll into view; capture phase since 'load' doesn't bubble */
document.addEventListener('load', e=>{
  if(e.target.tagName==='IMG' && e.target.loading==='lazy') e.target.classList.add('img-loaded');
}, true);

function parseHash(){
  const h = location.hash.replace('#','').split('/').filter(Boolean);
  return {view:h[0]||'cover', param:h[1]||null};
}

function render(){
  const {view, param} = parseHash();
  /* a live-dragged swipe (see bindLookInteractions) already animates the
     hero photo all the way to its resting position with its own finger-
     tracking motion before calling go() — set this flag right before that
     call so render() doesn't layer a second, independent crossfade on top
     of a transition the drag already finished. */
  const skipHeroAnim = window.__skipHeroAnim === true;
  window.__skipHeroAnim = false;
  const isLookToLook = view==='look' && document.querySelector('.look-detail');
  /* deliberately NOT gated on REDUCE_MOTION — this flag also controls
     whether the outgoing photo gets held (as a ghost) until the incoming
     one has actually loaded, which has nothing to do with whether the
     hand-off is animated. Excluding reduced-motion here used to skip
     that hold entirely, so the new #ldHeroImg's src was set directly
     from the fresh render with nothing covering the load gap — a blank
     photo for however long the fetch took. The global
     prefers-reduced-motion stylesheet rule already forces every
     transition-duration to .01ms site-wide, so this still resolves
     visually instant for those users; it just no longer blanks first. */
  const playHeroAnim = isLookToLook && !skipHeroAnim;

  /* must happen before the ghost snapshot below, not after it — the
     ghost is position:fixed at coordinates read via
     getBoundingClientRect() at snapshot time, so if the page were still
     scrolled when that read happened, the ghost would be pinned to
     wherever the hero was AT THAT SCROLL POSITION. Resetting scroll
     afterwards (as this used to do) then snaps the real page — including
     the fresh #ldHeroImg — up to the top while the already-positioned
     ghost stays exactly where it was, opening a real gap between them
     for the whole transition (or worse, on a long scroll, leaving the
     ghost off-screen entirely). */
  window.scrollTo({top:0,behavior:'instant'});

  /* snapshot the outgoing hero photo before anything gets torn down, so
     it can stay on screen — no animation of its own, just held in place
     — until the incoming photo has actually finished loading. Without
     this, the fresh #ldHeroImg goes blank for however long that load
     takes, which is the real problem this solves; sliding/crossfading
     it in on top was tried and explicitly didn't land (read as an
     off-putting "flying off the edges" effect), so the swap below is a
     hard, instant cut the moment the new photo is ready. */
  let heroGhost = null;
  if(playHeroAnim){
    document.querySelectorAll('.ld-hero-ghost').forEach(g=>g.remove());
    const oldImg = document.getElementById('ldHeroImg');
    if(oldImg){
      const r = oldImg.getBoundingClientRect();
      /* a <canvas> snapshot instead of a second <img src="same-cached-
         url">: a freshly-created <img> — even pointed at a URL the
         browser already has bytes for — has its own decode/paint
         lifecycle on real-device WebKit that isn't guaranteed to
         resolve in the same frame as the surrounding synchronous DOM
         work (the same underlying issue already worked around this
         session for the mannequin layers, the gender-toggle crossfade,
         and the toggle pill). That showed up here as the ghost simply
         not being painted yet at the exact moment the old page was torn
         down — a real blank gap before the crossfade ever started,
         confirmed on-device even with the load-gated swap already in
         place. Copying the OLD img's already-decoded, already-on-screen
         pixels into a canvas is a synchronous, immediate paint with no
         separate lifecycle to race. */
      const dpr = window.devicePixelRatio || 1;
      heroGhost = document.createElement('canvas');
      heroGhost.className = 'ld-hero-ghost';
      heroGhost.width = Math.max(1, Math.round(r.width * dpr));
      heroGhost.height = Math.max(1, Math.round(r.height * dpr));
      heroGhost.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`;
      const gctx = heroGhost.getContext('2d');
      if(gctx && oldImg.naturalWidth && oldImg.naturalHeight){
        gctx.scale(dpr, dpr);
        /* replicate object-fit:cover + object-position:top center by
           hand — drawImage() has no notion of either, and every hero
           photo in .ld-visual always uses exactly this combination. */
        const iw = oldImg.naturalWidth, ih = oldImg.naturalHeight;
        const scale = Math.max(r.width / iw, r.height / ih);
        const sw = r.width / scale, sh = r.height / scale;
        const sx = (iw - sw) / 2, sy = 0;
        gctx.drawImage(oldImg, sx, sy, sw, sh, 0, 0, r.width, r.height);
      }
      document.body.appendChild(heroGhost);
    }
  }

  /* the related-looks strip ("MORE IN ...") lists the same looks (same
     .ld-related-thumb ids, in the same order) whether tapping it jumps
     to look 3 or look 7 of the category — only which thumb carries
     .active moves. Rebuilding it from scratch on every navigation gave
     every thumbnail a brand-new <img loading="lazy"> that always starts
     at opacity:0 and has to wait for its own fresh 'load' event before
     fading back in — even fully cached, that read as the whole strip
     flickering blank on every tap. Below, once the new markup exists,
     the old strip (already loaded, mid-transition or not) gets swapped
     back in for the same-list case and only its active marker moves;
     this scroll snapshot is what lets that swap land at the same scroll
     position instead of resetting to 0. */
  const oldStrip = document.querySelector('.ld-related-strip');
  const oldStripIds = oldStrip ? [...oldStrip.children].map(c=>c.dataset.relatedId).join(',') : null;
  const relatedScrollLeft = oldStrip ? oldStrip.scrollLeft : null;

  document.querySelectorAll('#catnav button').forEach(b=>b.classList.toggle('active', view==='category' && b.dataset.cat===param));
  document.body.dataset.cat = view==='category'||view==='look' ? (view==='category'?param:LOOKS.find(l=>l.id===param)?.cat) : '';
  const cat = document.body.dataset.cat;
  if(cat) document.documentElement.style.setProperty('--accent-cat', CATEGORIES[cat].accent);
  if(cat) document.documentElement.style.setProperty('--accent-cat-a', CATEGORIES[cat].accent+'33');
  closeProduct();
  lookGalleryIdx = 0;
  if(!isLookToLook) lookPairView = 'M';

  const app = document.getElementById('app');
  app.classList.remove('app-out');
  if(view==='category') app.innerHTML = renderCategory(param);
  else if(view==='look') app.innerHTML = renderLook(param);
  else if(view==='mix') app.innerHTML = renderMix();
  else app.innerHTML = renderCover();

  if(view==='look'){
    const newStrip = document.querySelector('.ld-related-strip');
    const newStripIds = newStrip ? [...newStrip.children].map(c=>c.dataset.relatedId).join(',') : null;
    if(isLookToLook && oldStrip && newStrip && oldStripIds!==null && oldStripIds===newStripIds){
      oldStrip.querySelectorAll('.ld-related-thumb').forEach(a=>{
        const isCurrent = a.dataset.relatedId===param;
        a.classList.toggle('active', isCurrent);
        if(isCurrent) a.setAttribute('aria-current','page');
        else a.removeAttribute('aria-current');
      });
      /* scrollLeft has to be set AFTER the node is back in the document,
         not before — oldStrip is still detached at this point (its old
         parent's subtree was already torn down by the innerHTML swap
         above), and assigning scrollLeft on a detached element is a
         no-op: there's no scrollable viewport for it yet, so the value
         silently doesn't stick and the reattached strip lands at 0
         regardless of what it's set to here. */
      newStrip.replaceWith(oldStrip);
      if(relatedScrollLeft!==null) oldStrip.scrollLeft = relatedScrollLeft;
    } else if(relatedScrollLeft!==null && newStrip){
      newStrip.scrollLeft = relatedScrollLeft;
    }
  }

  const viewEl = app.querySelector('.view');
  if(isLookToLook && viewEl){
    /* skip the big blur/scale/translateY page-entrance animation — only
       the hero photo should visibly transition when hopping between looks,
       everything else (breadcrumb, item panel, related strip) can just be
       there, already-updated, with no animation of its own. */
    viewEl.classList.remove('view');
    if(playHeroAnim && heroGhost){
      const img = document.getElementById('ldHeroImg');
      const reveal = ()=>heroGhost.remove();
      /* hard cut the instant the new photo is actually ready — no fade,
         no slide. Still gated on load (not a fixed timer) so a slow,
         never-before-seen photo (the related-looks carousel makes that
         the common case) keeps the old one covering the gap for however
         long it takes, rather than reverting to a blank flash. */
      if(img && img.complete && img.naturalWidth > 0) reveal();
      else if(img){
        img.addEventListener('load', reveal, {once:true});
        img.addEventListener('error', reveal, {once:true});
      } else reveal();
    }
  } else if(viewEl){
    viewEl.classList.add('view');
    if(heroGhost) heroGhost.remove();
  }
  observeReveal();
  if(view==='look') bindLookInteractions(param);
  if(view==='category') bindCampaignInteractions(param);
  if(view==='mix'){
    if(MIX_TOPS.length && MIX_BOTTOMS.length){
      paintMix();
    } else {
      const stage = document.getElementById('mixStage');
      if(stage) stage.innerHTML = '<div class="mix-loading">불러오는 중…</div>';
      initMixPool().then(()=>{
        if(parseHash().view==='mix') paintMix();
      });
    }
  }
}

let campaignLooks = [], campaignIdx = 0;
function paintCampaign(){
  const l = campaignLooks[campaignIdx];
  const featured = document.getElementById('ecFeatured');
  if(!l || !featured) return;
  document.querySelectorAll('.ec-thumb').forEach((t,i)=>t.classList.toggle('active', i===campaignIdx));
  featured.classList.add('ec-swap');
  setTimeout(()=>{
    featured.innerHTML = `
      ${lookImgTag(l.campaignItems || l.items, 'editorial', l.campaignImg || l.img, `class="ec-bg" alt="" aria-hidden="true"`)}
      ${lookImgTag(l.campaignItems || l.items, 'editorial', l.campaignImg || l.img, `class="ec-fg" alt="${l.caption}"`)}
      <div class="ec-scrim"></div>
      <div class="ec-featured-cap"><div class="eyebrow">${CATEGORIES[l.cat].label}</div></div>
      <button type="button" class="ec-arrow ec-arrow-prev" onclick="event.stopPropagation();campaignNav(-1)" aria-label="Previous">&#8249;</button>
      <button type="button" class="ec-arrow ec-arrow-next" onclick="event.stopPropagation();campaignNav(1)" aria-label="Next">&#8250;</button>
    `;
    featured.classList.remove('ec-swap');
  }, REDUCE_MOTION ? 0 : 220);
}
function selectCampaign(i){
  campaignIdx = i;
  paintCampaign();
}
function campaignNav(dir){
  if(!campaignLooks.length) return;
  campaignIdx = (campaignIdx + dir + campaignLooks.length) % campaignLooks.length;
  paintCampaign();
}
function bindCampaignInteractions(key){
  campaignLooks = LOOKS.filter(l=>l.cat===key && l.hasEditorial);
  campaignIdx = 0;
  const featured = document.getElementById('ecFeatured');
  if(!featured || !campaignLooks.length) return;
  let sx=null, sy=null, swiped=false;
  featured.addEventListener('click', ()=>{
    if(swiped){ swiped=false; return; }
    go('look', campaignLooks[campaignIdx].id);
  });
  featured.addEventListener('touchstart', e=>{
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  featured.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)*1.5){
      campaignIdx = dx < 0 ? (campaignIdx+1)%campaignLooks.length : (campaignIdx-1+campaignLooks.length)%campaignLooks.length;
      paintCampaign();
      swiped = true;
    }
    sx = null; sy = null;
  }, {passive:true});
}

const COLLECTION_BY_CAT = {game:'Game Wear', casual:'Daily Wear', easy:'Easy Wear'};
/* Approximate swatch colors for the FULL LINE-UP color-dot picker — PRODUCTS
   only stores color NAMES (from the brand sheet), not hex values, so these
   are visual approximations for the dot only; the real name is always in
   the swatch's title/aria-label and in the product modal's COLOR row. */
const COLOR_HEX = {
  'Beige':'#8C8773','Beige Gray':'#B8AFA0','Black':'#141414','Blue':'#2851C4','Blue Gray':'#5C6B78',
  'Brown':'#7A5C3E','Charcoal':'#3A3A3C','Coral Red':'#E2543A','Dark Charcoal':'#2E2E30',
  'Dark Green':'#2F4A34','Dark Khaki':'#3A3529','Dark Navy':'#1B2A4A','Gray':'#9B9B9B','Green Charcoal':'#3E4A3E',
  'Indigo Blue':'#35538F','Ivory':'#F1ECDD','Khaki Gray':'#454C48','Light Brown':'#C9BCAF',
  'Marine':'#4FA6D9','Melange Gray':'#B7B4AC','Melange White':'#EDEAE3','Midnight':'#1C1F2A','Midnight Black':'#17171A',
  'Midnight Navy':'#16213A','Mint':'#D9F0E5','Navy':'#1E2A4A','Navy Blue':'#22335C','New Turquoise':'#1F5C52','Off White':'#F2EFE9',
  'Pale Blue':'#B9CCE0','Pale Green':'#9BAE87','Pale Lilac':'#D8CFE0','Pale Mint':'#C7DCCB','Pearl Beige':'#DCCBAF',
  'Pepper Mint':'#A9C9B8','Pink':'#E8A6B0','Smoke Navy':'#2B3245','Stone Charcoal':'#4B4A47',
  'Venus Blue':'#4FC7C0','Warm Gray':'#9C9488','White':'#FAFAF8',
};
function colorHex(name){ return COLOR_HEX[name] || '#B0B0B0'; }
/* Groups PRODUCTS entries by their shared .code — a product with several
   colorways (263TS033, 263TS033-2, ...) is one "style" with N variants,
   not N separate styles. Returns an array of variant-groups, each an
   array of [key,p] pairs in PRODUCTS insertion order (first = default
   colorway shown until a swatch is tapped). */
function productsForCat(key){
  const entries = Object.entries(PRODUCTS).filter(([,p])=>p.collection===COLLECTION_BY_CAT[key]);
  const groups = new Map();
  entries.forEach(([k,p])=>{
    if(!groups.has(p.code)) groups.set(p.code, []);
    groups.get(p.code).push([k,p]);
  });
  return Array.from(groups.values());
}

function filterFullLineup(g){
