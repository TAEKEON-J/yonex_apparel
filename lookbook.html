<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX 2026 F/W DIGITAL LOOKBOOK</title>
<meta name="description" content="YONEX 2026 Fall/Winter digital lookbook — model looks across Game Wear, Daily Wear and Easy Wear, with linked product ghost cuts.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121212'/><text x='50' y='68' font-family='Georgia,serif' font-weight='700' font-size='58' fill='%23F5F4F0' text-anchor='middle'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F6F5F1; --paper-3:#EFEDE6;
  --ink:#131313; --ink-soft:#4A4A46; --muted:#8C8B84;
  --line:rgba(19,19,19,.12); --line-soft:rgba(19,19,19,.07);
  --accent:#0C8F3D;
  --game:#C0402C; --casual:#33456B; --easy:#6E7A54;
  --sans:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Archivo','Noto Sans KR',var(--sans);
  --ease:cubic-bezier(.16,.8,.24,1);
}
*{box-sizing:border-box;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
body{-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:var(--sans);}
::selection{background:var(--ink);color:var(--paper);}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.serifnum{font-family:var(--mono);}

/* ===== TOP NAV ===== */
header.topnav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}
.topnav-row{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 28px;}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:0;}
.brand .mark{width:26px;height:26px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:15px;flex:none;}
.brand .name{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);}
.brand .season{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;display:block;margin-top:1px;}
nav.catnav{display:flex;gap:2px;flex:1 1 auto;min-width:0;}
nav.catnav button{background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);padding:9px 14px;transition:color .2s;position:relative;font-family:var(--display);text-transform:uppercase;white-space:nowrap;}
nav.catnav button::after{content:'';position:absolute;left:14px;right:14px;bottom:5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease);}
nav.catnav button:hover,nav.catnav button.active{color:var(--ink);}
nav.catnav button.active::after{transform:scaleX(1);}
.mix-link{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;border:1px solid var(--ink);padding:8px 14px;cursor:pointer;background:none;color:var(--ink);transition:background .2s,color .2s;white-space:nowrap;flex:none;}
.mix-link:hover{background:var(--ink);color:var(--paper);}
.search-wrap{position:relative;flex:none;}
.search-toggle{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;}
.search-toggle:hover{border-color:var(--ink);color:var(--ink);}
.search-toggle:active{transform:scale(.96);}
.search-panel{position:absolute;top:calc(100% + 10px);right:0;width:340px;max-width:calc(100vw - 32px);background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 40px rgba(20,20,15,.14);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s var(--ease),transform .2s var(--ease),visibility .2s;z-index:250;}
.search-panel.open{opacity:1;visibility:visible;transform:translateY(0);}
.search-input-row{display:flex;align-items:center;border-bottom:1px solid var(--line-soft);}
.search-input-row input{flex:1;min-width:0;border:none;background:none;padding:13px 14px;font-family:var(--mono);font-size:13px;color:var(--ink);outline:none;}
.search-input-row input::placeholder{color:var(--muted);}
.search-close{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:8px 12px;flex:none;}
.search-close:hover{color:var(--ink);}
.search-results{max-height:340px;overflow-y:auto;}
.search-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .15s;}
.search-row:last-child{border-bottom:none;}
.search-row:hover,.search-row.active{background:var(--paper-2);}
.search-row .sr-figure{width:36px;height:36px;flex:none;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.search-row .sr-figure img{max-width:100%;max-height:100%;object-fit:contain;}
.search-row .sr-info{min-width:0;flex:1;}
.search-row .sr-code{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink);}
.search-row .sr-name{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-row .sr-look{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;flex:none;}
.search-empty{padding:16px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
@media(max-width:820px){.topnav-row{padding:13px 16px;gap:6px;flex-wrap:nowrap;} nav.catnav{gap:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-end;} nav.catnav::-webkit-scrollbar{display:none;} nav.catnav button{padding:8px 7px;font-size:9.5px;} .brand{flex:none;} .brand .name{display:none;} .mix-link{padding:7px 9px;font-size:9px;} .search-toggle{width:30px;height:30px;} .search-panel{position:fixed;top:58px;left:12px;right:12px;width:auto;max-width:none;}}
@media(max-width:400px){nav.catnav button{padding:6px 4px;font-size:8.6px;} .mix-link{padding:6px 7px;font-size:8.1px;} .brand .season{display:none;} .search-toggle{width:26px;height:26px;}}

main#app{min-height:70vh;transition:opacity .22s var(--ease),transform .22s var(--ease),filter .22s var(--ease);}
main#app.app-out{opacity:0;transform:translateY(-8px);filter:blur(3px);}
.view{animation:viewIn .65s var(--ease) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}

/* ===== COVER ===== */
.cover{position:relative;height:100svh;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141414;}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;}
.cover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(8,8,8,.12) 45%,rgba(6,6,6,.88) 100%);}
.cover-in{position:relative;z-index:2;max-width:1320px;margin:0 auto;width:100%;padding:0 28px 64px;color:#fff;}
.cover-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.78);margin-bottom:18px;}
.cover h1{font-size:clamp(38px,7.4vw,92px);line-height:.98;color:#fff;letter-spacing:-.03em;text-transform:uppercase;max-width:980px;}
.cover-cats{display:flex;gap:0;margin-top:44px;border-top:1px solid rgba(255,255,255,.28);flex-wrap:wrap;}
.cover-cats button{flex:1 1 200px;text-align:left;background:none;border:none;border-right:1px solid rgba(255,255,255,.28);cursor:pointer;padding:20px 22px 22px;color:#fff;transition:background .25s,transform .18s var(--ease);font-family:var(--sans);}
.cover-cats button:last-child{border-right:none;}
.cover-cats button:hover{background:rgba(255,255,255,.08);}
.cover-cats button:active{transform:scale(.96);background:rgba(255,255,255,.13);}
.cover-cats .cc-num{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.6);letter-spacing:.08em;}
.cover-cats .cc-name{display:block;font-size:19px;font-weight:700;margin-top:8px;letter-spacing:-.01em;transition:transform .3s var(--ease);}
.cover-cats button:hover .cc-name{transform:translateX(3px);}
.cover-cats .cc-arrow{display:inline-block;margin-left:8px;transition:transform .25s var(--ease);}
.cover-cats button:hover .cc-arrow{transform:translateX(4px);}
@media(max-width:640px){.cover{min-height:640px;} .cover-cats button{flex:1 1 100%;border-right:none;border-top:1px solid rgba(255,255,255,.2);} .cover-cats button:first-child{border-top:none;}}

/* ===== CATEGORY PAGE ===== */
.cat-hero{padding:72px 28px 20px;max-width:1320px;margin:0 auto;}
.cat-tags{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.cat-tags span{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--accent-cat);padding:5px 11px;}
.cat-hero h2{font-size:clamp(34px,6vw,64px);letter-spacing:-.03em;text-transform:uppercase;}
.cat-hero p{font-size:15px;color:var(--ink-soft);margin-top:14px;max-width:480px;line-height:1.7;font-weight:300;}
.cat-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:26px;}

.look-grid{max-width:1320px;margin:0 auto;padding:36px 28px 110px;display:grid;grid-template-columns:repeat(2,1fr);gap:56px 32px;}
.look-card{cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.look-card.in{opacity:1;transform:translateY(0);}
.look-card .lc-frame{position:relative;overflow:hidden;background:var(--paper-2);aspect-ratio:4/5;transition:transform .18s var(--ease);}
.look-card .lc-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .7s var(--ease);}
.look-card:hover .lc-frame img{transform:scale(1.035);}
.look-card:active .lc-frame{transform:scale(.96);}
.look-card .lc-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;}
.look-card .lc-num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}
.look-card .lc-cap{font-size:15px;font-weight:600;margin-top:5px;}
.look-card .lc-view{font-family:var(--mono);font-size:10px;color:var(--accent-cat);letter-spacing:.06em;opacity:0;transition:opacity .25s;}
.look-card:hover .lc-view{opacity:1;}

/* category rhythm variants */
body[data-cat="game"] .look-grid,
body[data-cat="casual"] .look-grid{gap:70px 44px;grid-template-columns:repeat(2,1fr);}
body[data-cat="game"] .look-card .lc-frame,
body[data-cat="casual"] .look-card .lc-frame{aspect-ratio:4/5;}
body[data-cat="casual"] .look-card .lc-cap{font-weight:400;}
body[data-cat="easy"] .look-grid{gap:64px 40px;}
body[data-cat="easy"] .look-card .lc-frame{aspect-ratio:5/6;border-radius:2px;}
@media(max-width:760px){.look-grid{grid-template-columns:1fr 1fr;gap:28px 16px !important;} .cat-hero{padding:52px 18px 10px;} .cat-hero p{font-size:13.5px;line-height:1.6;margin-top:10px;} .look-grid{padding:26px 18px 80px;}}
@media(max-width:480px){.look-grid{grid-template-columns:1fr;}}

/* ===== CAMPAIGN (editorial carousel) ===== */
.editorial-carousel{max-width:1440px;margin:0 auto;padding:44px 28px 0;}
.ec-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;}
.ec-head h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;}
.ec-count{font-family:var(--mono);font-size:11px;color:var(--muted);}
.ec-featured{position:relative;aspect-ratio:3/2;overflow:hidden;cursor:pointer;background:var(--paper);transition:opacity .32s var(--ease);}
.ec-featured.ec-swap{opacity:0;}
.ec-featured .ec-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(34px) brightness(.82) saturate(1.1);transform:scale(1.18);}
.ec-featured .ec-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .5s var(--ease);}
.ec-featured:hover .ec-fg{transform:scale(1.02);}
.ec-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 35%);pointer-events:none;}
.ec-featured-cap{position:absolute;left:24px;bottom:22px;color:#fff;z-index:2;}
.ec-featured-cap .eyebrow{color:rgba(255,255,255,.75);}
.ec-featured-cap h3{color:#fff;font-size:24px;margin-top:6px;letter-spacing:-.01em;}
.ec-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;font-size:19px;line-height:1;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s var(--ease);}
.ec-arrow:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.75);}
.ec-arrow:active{transform:translateY(-50%) scale(.96);}
.ec-arrow-prev{left:16px;}
.ec-arrow-next{right:16px;}
.ec-strip{display:flex;gap:10px;margin-top:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.ec-strip::-webkit-scrollbar{display:none;}
.ec-thumb{flex:0 0 110px;aspect-ratio:4/5;cursor:pointer;scroll-snap-align:start;overflow:hidden;background:var(--paper-3);border:1px solid transparent;transition:border-color .2s,transform .18s var(--ease),opacity .2s var(--ease);}
.ec-thumb.active{border-color:var(--ink);opacity:.55;}
.ec-thumb:active{transform:scale(.96);}
.ec-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;}
@media(max-width:760px){
  .editorial-carousel{padding:34px 18px 0;}
  .ec-featured{aspect-ratio:4/5;background:var(--paper-3);}
  .ec-featured .ec-bg{display:none;}
  .ec-featured .ec-fg{object-fit:cover;object-position:50% 18%;}
  .ec-featured-cap h3{font-size:20px;}
  .ec-thumb{flex-basis:88px;}
  .ec-arrow{width:34px;height:34px;font-size:15px;}
  .ec-arrow-prev{left:10px;}
  .ec-arrow-next{right:10px;}
}

/* ===== FULL LINE-UP (all SKUs in a category) ===== */
.full-lineup{max-width:1320px;margin:0 auto;padding:0 28px 120px;border-top:1px solid var(--line-soft);}
.fl-head{display:flex;align-items:baseline;justify-content:space-between;padding:46px 0 30px;flex-wrap:wrap;gap:14px;}
.fl-head h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;}
.fl-head-right{display:flex;align-items:center;gap:16px;}
.fl-toggle{display:inline-flex;border:1px solid var(--line);}
.fl-toggle button{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:7px 13px;background:none;border:none;cursor:pointer;color:var(--muted);transition:background .18s,color .18s;}
.fl-toggle button:not(:last-child){border-right:1px solid var(--line);}
.fl-toggle button.active{background:var(--ink);color:var(--paper);}
.fl-toggle button:active{transform:scale(.96);}
.fl-count{font-family:var(--mono);font-size:11px;color:var(--muted);}
.fl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px 18px;}
.fl-card{cursor:pointer;opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease),transform .5s var(--ease);}
.fl-card.in{opacity:1;transform:translateY(0);}
.fl-card.fl-hide{opacity:0 !important;transform:scale(.92) !important;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);}
.fl-card:active .fl-frame{transform:scale(.96);}
.fl-card .fl-frame{aspect-ratio:1/1;background:var(--paper);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .2s,transform .18s var(--ease);}
.fl-card:hover .fl-frame{border-color:var(--ink-soft);}
.fl-card .fl-frame img{max-width:82%;max-height:82%;object-fit:contain;transition:transform .3s var(--ease);}
.fl-card:hover .fl-frame img{transform:scale(1.04);}
.fl-card .fl-code{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:10px;letter-spacing:.02em;}
.fl-card .fl-sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;}
@media(max-width:980px){.fl-grid{grid-template-columns:repeat(4,1fr);gap:22px 14px;}}
@media(max-width:640px){.full-lineup{padding:0 18px 90px;} .fl-head{padding:34px 0 22px;} .fl-grid{grid-template-columns:repeat(3,1fr);gap:18px 10px;} .fl-card .fl-code{font-size:9.5px;} .fl-card .fl-sub{font-size:8.5px;}}

/* ===== LOOK DETAIL ===== */
.look-detail{max-width:1440px;margin:0 auto;padding:28px 28px 0;}
.ld-crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;padding:14px 0 26px;}
.ld-back{color:var(--ink);font-weight:700;text-decoration:none;transition:opacity .2s;}
.ld-back:hover{opacity:.6;}
.ld-crumb b{color:var(--ink);font-weight:700;}
.ld-crumb .sep{opacity:.4;}
.ld-look-gtoggle{margin-left:auto;display:inline-flex;border:1px solid var(--ink);}
.ld-look-gtoggle button{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:7px 14px;background:none;border:none;cursor:pointer;color:var(--ink-soft);transition:background .18s,color .18s;}
.ld-look-gtoggle button:first-child{border-right:1px solid var(--ink);}
.ld-look-gtoggle button.active{background:var(--ink);color:var(--paper);}
.ld-split{display:grid;grid-template-columns:65fr 35fr;gap:0;align-items:stretch;min-height:78vh;border:1px solid var(--line-soft);}
.ld-visual{position:relative;background:var(--paper-3);overflow:hidden;min-height:420px;}
.ld-visual img{width:100%;height:100%;object-fit:cover;object-position:top center;}
#ldHeroImg{transition:opacity .2s var(--ease);}
#ldHeroImg.ld-hero-swap{opacity:0;}
.ld-gallery-dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;gap:9px;}
.ld-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.25);padding:0;cursor:pointer;transition:background .2s,transform .15s var(--ease);}
.ld-dot.active{background:#fff;}
.ld-dot:active{transform:scale(.85);}
.ld-caption{position:absolute;left:24px;bottom:24px;color:#fff;z-index:2;}
.ld-caption .eyebrow{color:rgba(255,255,255,.75);}
.ld-caption h3{color:#fff;font-size:26px;margin-top:6px;letter-spacing:-.01em;}
.ld-visual .vscrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 30%);pointer-events:none;}

.ld-items{background:var(--paper);display:flex;flex-direction:column;border-left:1px solid var(--line-soft);}
.ld-item{flex:1;display:flex;flex-direction:column;padding:28px 30px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .25s;position:relative;}
.ld-item:last-child{border-bottom:none;}
.ld-item:hover,.ld-item.hover-active{background:var(--paper-2);}
.ld-item .ii-top{display:flex;justify-content:space-between;align-items:baseline;}
.ld-item .ii-slot{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent-cat);}
.ld-item .ii-figure{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0;min-height:120px;}
.ld-item .ii-figure img{max-height:min(54vh,440px);width:auto;max-width:82%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(20,20,15,.10));transition:transform .35s var(--ease);}
.ld-item:hover .ii-figure img{transform:translateY(-3px) scale(1.02);}
.ld-item .ii-info{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}

/* ---------------- STATE / ROUTER ---------------- */
let mixTopIdx = 0, mixBottomIdx = 0;
let lookGalleryIdx = 0;
let lookPairView = 'M';

const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(view, param){
  const target = param ? `${view}/${param}` : view;
  if(location.hash.replace('#','') === target) return;
  const app = document.getElementById('app');
  if(app && app.children.length && !REDUCE_MOTION){
    app.classList.add('app-out');
    setTimeout(()=>{ location.hash = target; }, 190);
  } else {
    location.hash = target;
  }
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function parseHash(){
  const h = location.hash.replace('#','').split('/').filter(Boolean);
  return {view:h[0]||'cover', param:h[1]||null};
}

function render(){
  const {view, param} = parseHash();
  document.querySelectorAll('#catnav button').forEach(b=>b.classList.toggle('active', view==='category' && b.dataset.cat===param));
  document.body.dataset.cat = view==='category'||view==='look' ? (view==='category'?param:LOOKS.find(l=>l.id===param)?.cat) : '';
  const cat = document.body.dataset.cat;
  if(cat) document.documentElement.style.setProperty('--accent-cat', CATEGORIES[cat].accent);
  if(cat) document.documentElement.style.setProperty('--accent-cat-a', CATEGORIES[cat].accent+'33');
  window.scrollTo({top:0,behavior:'instant'});
  closeProduct();
  lookGalleryIdx = 0;
  lookPairView = 'M';

  const app = document.getElementById('app');
  app.classList.remove('app-out');
  if(view==='category') app.innerHTML = renderCategory(param);
  else if(view==='look') app.innerHTML = renderLook(param);
  else if(view==='mix') app.innerHTML = renderMix();
  else app.innerHTML = renderCover();

  app.querySelector('.view')?.classList.add('view');
  observeReveal();
  if(view==='look') bindLookInteractions(param);
  if(view==='category') bindCampaignInteractions(param);
  if(view==='mix') paintMix();
}

      <button type="button" class="ec-arrow ec-arrow-next" onclick="event.stopPropagation();campaignNav(1)" aria-label="Next">&#8250;</button>
    `;
    featured.classList.remove('ec-swap');
  }, REDUCE_MOTION ? 0 : 220);
}
function selectCampaign(i){
  campaignIdx = i;
  paintCampaign();
}
function campaignNav(dir){
  if(!campaignLooks.length) return;
  campaignIdx = (campaignIdx + dir + campaignLooks.length) % campaignLooks.length;
  paintCampaign();
}
function bindCampaignInteractions(key){
  campaignLooks = LOOKS.filter(l=>l.cat===key && l.hasEditorial);
  campaignIdx = 0;
  const featured = document.getElementById('ecFeatured');
  if(!featured || !campaignLooks.length) return;
  let sx=null, sy=null, swiped=false;
  featured.addEventListener('click', ()=>{
    if(swiped){ swiped=false; return; }
    go('look', campaignLooks[campaignIdx].id);
  });
  featured.addEventListener('touchstart', e=>{
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  featured.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)*1.5){
      campaignIdx = dx < 0 ? (campaignIdx+1)%campaignLooks.length : (campaignIdx-1+campaignLooks.length)%campaignLooks.length;
      paintCampaign();
      swiped = true;
    }
    sx = null; sy = null;
  }, {passive:true});
}

/* ---------------- images/looks/ auto-matching ----------------
   Naming convention: {TOP code}_{BOTTOM code}[_{other codes}]_{model|editorial}.jpg
   (lowercase, full M/F/U-suffixed codes, slots ordered TOP→BOTTOM→other; a
   TOP-only look just omits the rest, e.g. "263ts002f_model.jpg"). Drop a file
   matching a look's codes into images/looks/ and it's picked up automatically —
   no code change needed. Until then the <img> quietly falls back to the
   look's temporary placeholder photo. */
const LOOK_IMG_SLOT_ORDER = ['TOP','BOTTOM','OUTER','BAG'];
function lookFilenameBase(items, upper){
  const ordered = [...items].sort((a,b)=>LOOK_IMG_SLOT_ORDER.indexOf(a.slot)-LOOK_IMG_SLOT_ORDER.indexOf(b.slot));
  return ordered.map(it=>{
    const code = PRODUCTS[it.code]?.code || it.code;
    return upper ? code.toUpperCase() : code.toLowerCase();
  }).join('_');
}
function lookImgTag(items, type, fallbackSrc, attrs=''){
  /* file case is a common real-world mismatch (static hosts are case-sensitive),
     so this tries the codes as-uploaded for ghost cuts (UPPER, matching
     images/products/) before falling back to an all-lowercase guess. */
  const chainFor = t => {
    const upperBase = `images/looks/${lookFilenameBase(items, true)}_${t}`;
    const lowerBase = `images/looks/${lookFilenameBase(items, false)}_${t}`;
    return [`${upperBase}.jpg`, `${upperBase}.jpeg`, `${upperBase}.png`,
             `${lowerBase}.jpg`, `${lowerBase}.jpeg`, `${lowerBase}.png`];
  };
  /* not every look has a separate 화보컷 (editorial) shoot yet — if the
     auto-guessed editorial filename isn't found, trust the look's own img
     field (already the best available photo, editorial or otherwise) before
     falling back to a blind 모델컷 (model) filename guess, since that guess
     can accidentally match a real but wrong file (e.g. a model-cut shot for
     a different top/bottom pairing than the curated editorial photo). */
  const chain = type==='editorial' ? [...chainFor('editorial'), fallbackSrc, ...chainFor('model')] : [...chainFor(type), fallbackSrc];
  return `<img src="${chain[0]}" data-chain='${JSON.stringify(chain.slice(1))}' onerror="imgChainNext(this)" ${attrs}>`;
}
function imgChainNext(img){
  let chain = [];
  try{ chain = JSON.parse(img.dataset.chain || '[]'); }catch(e){}
  if(!chain.length){ img.onerror = null; return; }
  img.src = chain.shift();
  img.dataset.chain = JSON.stringify(chain);
}

/* resolves the M/W code pair for an item regardless of which side it.code points to */
function genderInfo(code){
  const p = PRODUCTS[code];
  if(!p || !p.pairCode) return null;
  const q = PRODUCTS[p.pairCode];
  if(!q) return null;
  return {
    m: p.gender==='Men' ? code : p.pairCode,
    w: p.gender==='Women' ? code : p.pairCode,
    active: p.gender==='Women' ? 'W' : 'M',
  };
}

/* re-paints the look view in place (no scroll reset, no hash change) — used
   by the couple-look MEN/WOMEN toggle and its swipe equivalent so switching
   variant doesn't jump the page */
function paintLook(id){
  const app = document.getElementById('app');
  app.innerHTML = renderLook(id);
  app.querySelector('.view')?.classList.add('view');
  bindLookInteractions(id);
}

function renderLook(id){
  const look = LOOKS.find(l=>l.id===id);
  if(!look) return renderCover();
  const c = CATEGORIES[look.cat];
  const catLooks = LOOKS.filter(l=>l.cat===look.cat);
  const idx = catLooks.findIndex(l=>l.id===id);
  const prev = catLooks[(idx-1+catLooks.length)%catLooks.length];
  const next = catLooks[(idx+1)%catLooks.length];

  /* a "couple" look has a look.pair object — the same shape as the look
     itself (img/fitImg/items/hotspots) but photographed on the opposite-
     gender model for the same matching design. Toggling (MEN/WOMEN tap,
     or swiping the hero) swaps the photo AND the item panel to that
     variant in place — not a side-by-side layout. */
  const showW = lookPairView==='W' && look.pair;
  const variant = showW ? look.pair : look;

  /* a look can optionally list a few model-cut photos of the same outfit
     (different angles/poses) via look.photos — the hero then shows a small
     tap-through dot gallery instead of just the one shot. Falls back to the
     single fitImg/img when absent. Not used together with look.pair. */
  const photos = !look.pair && look.photos && look.photos.length ? look.photos : [variant.fitImg || variant.img];
  const activePhoto = photos[Math.min(lookGalleryIdx, photos.length - 1)];
  const dotsHtml = photos.length > 1 ? `<div class="ld-gallery-dots">${photos.map((_,i)=>
    `<button type="button" class="ld-dot${i===lookGalleryIdx?' active':''}" onclick="event.stopPropagation();selectLookPhoto(${i})" aria-label="Photo ${i+1}"></button>`
  ).join('')}</div>` : '';

  const pairToggleHtml = look.pair ? `<div class="ld-look-gtoggle">
      <button type="button" class="${showW?'':'active'}" data-lg="M">MEN</button>
      <button type="button" class="${showW?'active':''}" data-lg="W">WOMEN</button>
    </div>` : '';

  /* two-dot indicator under the hero photo for paired looks — signals that
     the photo itself is swipeable/tappable between MEN and WOMEN, since
     nothing about a plain photo otherwise hints that a swipe does anything.
     Mirrors the multi-photo gallery dots (mutually exclusive with those). */
  const pairDotsHtml = look.pair ? `<div class="ld-gallery-dots ld-pair-dots">
    <button type="button" class="ld-dot${showW?'':' active'}" onclick="event.stopPropagation();lookPairView='M';paintLook('${look.id}');" aria-label="Men"></button>
    <button type="button" class="ld-dot${showW?' active':''}" onclick="event.stopPropagation();lookPairView='W';paintLook('${look.id}');" aria-label="Women"></button>
  </div>` : '';

  const heroHtml = `
    <img src="${activePhoto}" alt="${look.caption}" id="ldHeroImg">
    <div class="vscrim"></div>
    <div class="ld-caption"><div class="eyebrow">${c.label}</div></div>
    ${dotsHtml}${pairDotsHtml}`;

  const itemsHtml = variant.items.map((it,i)=>{
    const p = PRODUCTS[it.code];
    const isBottom = it.slot.toLowerCase()==='bottom';
    const gi = (!look.pair && !look.noGenderToggle && !isBottom) ? genderInfo(it.code) : null;
    const toggleHtml = gi
      ? `<div class="ii-gtoggle"><button type="button" class="${gi.active==='M'?'active':''}" data-g="M">M</button><button type="button" class="${gi.active==='W'?'active':''}" data-g="W">W</button></div>`
      : '';
    const priceLine = p ? (isBottom ? fmtPrice(p.price) : `${fmtPrice(p.price)} · ${p.color}`) : '';
    return `<div class="ld-item" data-slot="${it.slot.toLowerCase()}" data-active-code="${it.code}" data-code-m="${gi?gi.m:''}" data-code-w="${gi?gi.w:''}">
      <div class="ii-top"><span class="ii-slot">${it.slot}</span></div>
      <div class="ii-figure"><img src="${itemFig(it.code)}" alt="${p?p.name:it.slot}"></div>
      <div class="ii-info">
        <div class="ii-name">${p?p.code:it.code}</div>
        <div class="ii-code">${priceLine}</div>
      </div>
      ${toggleHtml}
    </div>`;
  }).join('');

  /* All other looks in this category — replaces PREV/NEXT LOOK with a
     swipeable strip so jumping to any other look is one tap, not a
     click-through-them-all-in-order chain. */
  const otherLooksHtml = catLooks.filter(l=>l.id!==id).map(l=>
    `<div class="ld-related-thumb" onclick="go('look','${l.id}')">${lookImgTag(l.items, 'editorial', l.img, `alt="${l.caption}" loading="lazy"`)}</div>`
  ).join('');

  return `<div class="view">
    <section class="look-detail" data-prev="${prev.id}" data-next="${next.id}" data-id="${id}">
      <div class="ld-crumb">
        <a class="ld-back" href="#category/${look.cat}" onclick="event.preventDefault();go('category','${look.cat}')">&larr; ${c.label}</a>
        <span class="sep">/</span><b>LOOK ${String(look.num).padStart(2,'0')}</b>
        ${pairToggleHtml}
      </div>
      <div class="ld-split">
        <div class="ld-visual" id="ldVisual">
          ${heroHtml}
          <button type="button" class="ec-arrow ec-arrow-prev" onclick="event.stopPropagation();go('look','${prev.id}')" aria-label="Previous look">&#8249;</button>
          <button type="button" class="ec-arrow ec-arrow-next" onclick="event.stopPropagation();go('look','${next.id}')" aria-label="Next look">&#8250;</button>
        </div>
        <div class="ld-items">${itemsHtml}</div>
      </div>
    </section>
    <nav class="ld-nav">
      <div class="ld-related-strip">${otherLooksHtml}</div>
    </nav>
  </div>`;
}

function wornWithFor(code, excludeLookId){
  return LOOKS.filter(l=>l.id!==excludeLookId && l.items.some(it=>it.code===code));
}

function selectLookPhoto(i){
  const look = LOOKS.find(l=>l.id===parseHash().param);

function bindLookInteractions(id){

  if(!visual) return;

  document.querySelectorAll('.ld-look-gtoggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      lookPairView = btn.dataset.lg;
      paintLook(id);
    });
  });
  document.querySelectorAll('.ld-item').forEach(el=>{
    const slot = el.dataset.slot;

    el.addEventListener('click', e=>{
      if(e.target.closest('.ii-gtoggle')) return;
      openProduct(el.dataset.activeCode, id);
    });
    el.querySelectorAll('.ii-gtoggle button').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();

        el.querySelectorAll('.ii-gtoggle button').forEach(b=>b.classList.toggle('active', b===btn));
      });

  document.addEventListener('keydown', lookKeyNav);

  const detail = document.querySelector('.look-detail');
  let swipeX = null, swipeY = null;
  visual.addEventListener('touchstart', e=>{
    swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY;
  }, {passive:true});
  visual.addEventListener('touchend', e=>{
    if(swipeX===null) return;
    const dx = e.changedTouches[0].clientX - swipeX;
    const dy = e.changedTouches[0].clientY - swipeY;
    if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(look && look.pair){
        lookPairView = lookPairView==='W' ? 'M' : 'W';
        paintLook(id);
      } else {
        go('look', dx < 0 ? detail.dataset.next : detail.dataset.prev);
      }
    }
    swipeX = null; swipeY = null;
  }, {passive:true});
}
function lookKeyNav(e){
  const {view, param} = parseHash();
  if(view!=='look') return;
  const look = LOOKS.find(l=>l.id===param); if(!look) return;
  const catLooks = LOOKS.filter(l=>l.cat===look.cat);
  const idx = catLooks.findIndex(l=>l.id===param);
  if(e.key==='ArrowRight') go('look', catLooks[(idx+1)%catLooks.length].id);
  if(e.key==='ArrowLeft') go('look', catLooks[(idx-1+catLooks.length)%catLooks.length].id);
}

/* ---------------- PRODUCT CODE SEARCH ----------------
   Header search: type a product code, get live matches across every LOOK
   (including the hidden gender-variant items inside look.pair), click/Enter
   jumps straight to that look's page (showing its model cut) — no separate
   "search page", just a jump. Results are ordered TOP items before BOTTOM
   items (then original look order) so e.g. searching "001" lists tops
   first, bottoms below. */
let searchActiveIdx = -1;
const SLOT_RANK = {top:0, bottom:1};
function searchProducts(query){
  const q = query.trim().toUpperCase();
  if(!q) return [];
  const seen = new Set();
  const results = [];
  LOOKS.forEach(look=>{
    const variants = look.pair ? [[false, look.items],[true, look.pair.items]] : [[false, look.items]];
    variants.forEach(([isPair, items])=>{
      items.forEach(it=>{
        const p = PRODUCTS[it.code];
        if(!p) return;
        const key = it.code.toUpperCase();
        const disp = p.code.toUpperCase();
        if(!key.includes(q) && !disp.includes(q)) return;
        const dedupe = look.id+'|'+isPair+'|'+it.code;
        if(seen.has(dedupe)) return;
        seen.add(dedupe);
        results.push({lookId:look.id, isPair, code:it.code, product:p, look, slot:it.slot});
      });
    });
  });
  results.sort((a,b)=>{
    const ra = SLOT_RANK[(a.slot||'').toLowerCase()] ?? 2;
    const rb = SLOT_RANK[(b.slot||'').toLowerCase()] ?? 2;
    return ra - rb;
  });
  return results.slice(0,8);
}
function onSearchInput(value){
  searchActiveIdx = -1;
  const box = document.getElementById('searchResults');
  if(!value.trim()){ box.innerHTML = ''; window.__searchResults = []; return; }
  const results = searchProducts(value);
  window.__searchResults = results;
  if(!results.length){ box.innerHTML = `<div class="search-empty">NO MATCHING PRODUCT CODE</div>`; return; }
  box.innerHTML = results.map((r,i)=>`
    <div class="search-row" data-idx="${i}" onclick="jumpToSearchResult(${i})">
      <div class="sr-figure"><img src="${r.product.img}" alt=""></div>
      <div class="sr-info">
        <div class="sr-code">${r.product.code}</div>
        <div class="sr-name">${r.product.color ? `${r.product.name} · ${r.product.color}` : r.product.name}</div>
      </div>
      <div class="sr-look">LOOK ${String(r.look.num).padStart(2,'0')}</div>
    </div>`).join('');
}
function onSearchKeydown(e){
  const box = document.getElementById('searchResults');
  const rows = box ? Array.from(box.querySelectorAll('.search-row')) : [];
  if(e.key==='Enter'){
    e.preventDefault();
    if(!rows.length) return;
    jumpToSearchResult(searchActiveIdx>=0 ? searchActiveIdx : 0);
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(!rows.length) return;
    searchActiveIdx = Math.min(searchActiveIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('active', i===searchActiveIdx));
    rows[searchActiveIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(!rows.length) return;
    searchActiveIdx = Math.max(searchActiveIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('active', i===searchActiveIdx));
    rows[searchActiveIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Escape'){
    closeSearch();
  }
}
function jumpToSearchResult(i){
  const hit = (window.__searchResults||[])[i];
  if(!hit) return;
  closeSearch();
  const finish = ()=>{
    if(hit.isPair && lookPairView!=='W'){ lookPairView='W'; paintLook(hit.lookId); }
  };
  if(parseHash().view==='look' && parseHash().param===hit.lookId){
    finish();
  } else {
    window.addEventListener('hashchange', function once(){
      window.removeEventListener('hashchange', once);
      finish();
    }, {once:true});
    go('look', hit.lookId);
  }
}
function toggleSearch(){
  document.getElementById('searchPanel')?.classList.contains('open') ? closeSearch() : openSearch();
}
function openSearch(){
  const panel = document.getElementById('searchPanel');
  if(!panel) return;
  panel.classList.add('open');
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchResults').innerHTML = '';
  window.__searchResults = [];
  searchActiveIdx = -1;
  setTimeout(()=>input.focus(), 50);
  document.addEventListener('click', onSearchOutsideClick);
}
function closeSearch(){
  document.getElementById('searchPanel')?.classList.remove('open');
  document.removeEventListener('click', onSearchOutsideClick);
}
function onSearchOutsideClick(e){
  const wrap = document.querySelector('.search-wrap');
  if(wrap && !wrap.contains(e.target)) closeSearch();
}

/* ---------------- MIX & MATCH ---------------- */
function renderMix(){
  return `<div class="view">
    <section class="mix-hero">
      <span class="eyebrow">STYLE MIX</span>
      <h2>Build Your Own Look</h2>
      <p>Pair a top with a bottom from the Game Wear collection. If the combination exists as a styled look, you can jump straight to it.</p>
    </section>
    <section class="mix-stage" id="mixStage"></section>
    <section class="mix-cta" id="mixCta"></section>
  </div>`;
}
function mixTopCode(){ return MIX_TOPS[mixTopIdx]; }
function mixBottomCode(){ return MIX_BOTTOMS[mixBottomIdx]; }
function mixMatchLook(){
  return LOOKS.find(l=>{
    const codes = l.items.map(i=>i.code);
    return codes.includes(mixTopCode()) && codes.includes(mixBottomCode());
  });
}
function paintMix(){
  const stage = document.getElementById('mixStage');
  const cta = document.getElementById('mixCta');
  if(!stage) return;
  const top = PRODUCTS[mixTopCode()], bottom = PRODUCTS[mixBottomCode()];
  stage.innerHTML = `
    <div class="mix-slot">
      <button class="mix-arrow" onclick="shiftMix('top',-1)">&larr;</button>
      <div class="mix-figure">
        <div class="ms-imgwrap"><img src="${top.img}" alt="${top.name}"></div>
        <div class="ms-text">
          <div class="ms-label">TOP</div>
          <div class="ms-name">${top.name}</div>
          <div class="ms-code">${top.code} — ${top.color}</div>
        </div>
      </div>
      <button class="mix-arrow" onclick="shiftMix('top',1)">&rarr;</button>
    </div>
    <div class="mix-slot">
      <button class="mix-arrow" onclick="shiftMix('bottom',-1)">&larr;</button>
      <div class="mix-figure">
        <div class="ms-imgwrap"><img src="${bottom.img}" alt="${bottom.name}"></div>
        <div class="ms-text">
          <div class="ms-label">BOTTOM</div>
          <div class="ms-name">${bottom.name}</div>
          <div class="ms-code">${bottom.code} — ${bottom.color}</div>
        </div>
      </div>
      <button class="mix-arrow" onclick="shiftMix('bottom',1)">&rarr;</button>
    </div>`;
  const match = mixMatchLook();
  cta.innerHTML = match
    ? `<button onclick="go('look','${match.id}')">VIEW STYLING &rarr;</button><div class="mc-note">Styled as ${CATEGORIES[match.cat].label} — LOOK ${String(match.num).padStart(2,'0')}</div>`
    : `<button disabled>VIEW STYLING</button><div class="mc-note">No styled photo for this pairing yet</div>`;
}
function shiftMix(which, dir){
  if(which==='top') mixTopIdx = (mixTopIdx + dir + MIX_TOPS.length) % MIX_TOPS.length;
  else mixBottomIdx = (mixBottomIdx + dir + MIX_BOTTOMS.length) % MIX_BOTTOMS.length;
  paintMix();
}
/* touch swipe on mix figures */
let touchX = null;
document.addEventListener('touchstart', e=>{
  if(e.target.closest('.mix-figure')) touchX = e.touches[0].clientX;
});
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const fig = e.target.closest('.mix-figure');
  if(fig && Math.abs(dx) > 40){
    const which = fig.querySelector('.ms-label').textContent === 'TOP' ? 'top' : 'bottom';
    shiftMix(which, dx < 0 ? 1 : -1);
  }
  touchX = null;
});

/* ---------------- REVEAL ON SCROLL ---------------- */
function observeReveal(){
  const items = document.querySelectorAll('.reveal:not(.in)');
  if(!items.length) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  items.forEach(el=>io.observe(el));
}
</script>
